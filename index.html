  }

  /* ---------- Vistas ---------- */
  function header() {
    return '<header class="top"><img class="mark app-icon" src="icons/apple-touch-icon.png" alt=""><div><div class="eyebrow">Tarjeta de crédito · registro personal</div><h1>Master</h1></div></header>';
  }

  function hero(c) {
    var h = '<section class="hero" aria-label="Cupo de la tarjeta">' + I_ART + '<div class="hero-top"><span class="eyebrow">Disponible</span>';
    if (!loading && cfg.desde) h += '<button class="hero-btn" data-act="setup">Ajustar</button>';
    h += '</div>';
    if (loading) {
      h += '<div class="total word">Cargando…</div><p class="hero-note">Buscando tus movimientos.</p>';
    } else if (!cfg.desde) {
      h += '<div class="total word">Sin definir</div>' +
        '<p class="hero-note">Para partir, escribe el cupo de la tarjeta y el utilizado que muestra hoy la app del banco.</p>' +
        '<button class="hero-cta" data-act="setup">Ingresar cupo y utilizado</button>';
    } else {
      var txt = money(c.avail);
      var size = txt.length <= 8 ? 'xl' : txt.length <= 10 ? 'lg' : txt.length <= 11 ? 'md' : 'sm';
      var ratio = cfg.limit > 0 ? c.used / cfg.limit : 0, pct = Math.max(0, Math.min(100, ratio * 100));
      var pctTxt = ratio <= 0 ? '0%' : ratio < 0.01 ? 'menos del 1%' : Math.round(ratio * 100) + '%';
      h += '<div class="total ' + size + '">' + txt + '</div>' +
        '<div class="meter' + (pct <= 0 ? ' zero' : '') + (c.avail < 0 ? ' full' : '') + '" role="img" aria-label="Utilizado ' + pctTxt + ' del cupo"><i style="width:' + pct.toFixed(2) + '%"></i></div>';
      if (c.avail < 0) h += '<p class="hero-note warn">Lo utilizado supera el cupo en ' + money(-c.avail) + '. Revisa si falta un abono o toca «Ajustar».</p>';
      else if (c.used < 0) h += '<p class="hero-note">Tienes ' + money(-c.used) + ' a favor en la tarjeta.</p>';
      else h += '<p class="hero-note">Usas el ' + pctTxt + ' del cupo</p>';
      h += '<dl class="hero-stats"><div><dt>Utilizado</dt><dd>' + money(c.used) + '</dd></div><div><dt>Cupo</dt><dd>' + money(cfg.limit) + '</dd></div></dl>';
    }
    return h + '</section>';
  }

  function actions() {
    var main;
    if (!canSync) main = '<button class="btn primary big" data-act="paste">' + I_MAIL + 'Pegar aviso</button>';
    else if (!prefs.repo) main = '<button class="btn primary big" data-act="box">' + I_MAIL + 'Conectar buzón</button>';
    else main = '<button class="btn primary big" data-act="sync"' + (syncing ? ' disabled' : '') + '>' + I_MAIL + (syncing ? 'Leyendo…' : 'Actualizar') + '</button>';
    var h = '<div class="actions">' + main +
      '<button class="btn ghost big" data-act="add" data-t="c">' + I_BAG + 'Compra</button>' +
      '<button class="btn ghost big" data-act="add" data-t="g" aria-label="Anotar un cargo: resta del disponible">' + I_MINUS + 'Cargo</button>' +
      '<button class="btn plus big" data-act="add" data-t="a" aria-label="Anotar un abono o pago: suma al disponible">' + I_PLUS + 'Abono</button></div>';
    if (!canSync) {
      h += '<p class="sync plain">Aquí las compras se agregan pegando el aviso. La lectura automática y el widget funcionan en la app instalada desde GitHub.</p>' +
        '<div class="under"><button class="linkbtn" data-act="away">Buzón y widget</button></div>';
    } else if (prefs.repo) {
      if (syncing) h += '<div class="sync busy" role="status"><i></i><span>Leyendo el buzón de avisos…</span></div>';
      else if (syncErr) h += '<div class="sync bad" role="status"><i></i><span>' + errMsg(syncErr) + '</span></div>';
      else h += '<div class="sync"><i></i><span>Buzón conectado · ' + (prefs.last ? 'leído ' + ago(prefs.last) : 'aún sin leer') + '</span></div>';
      h += '<div class="under"><button class="linkbtn" data-act="paste">Pegar un aviso</button><button class="linkbtn" data-act="box">Buzón y atajo</button><button class="linkbtn" data-act="widget">Widget</button></div>';
    } else {
      h += '<div class="under"><button class="linkbtn" data-act="paste">Pegar un aviso</button><button class="linkbtn" data-act="widget">Widget</button></div>';
    }
    return h;
  }

  function startBlock() {
    function step(n, act, done, title, text) {
      return '<li><button class="step' + (done ? ' done' : '') + '" data-act="' + act + '"><span class="step-n">' + (done ? I_CHECK : n) + '</span>' +
        '<span class="step-t"><b>' + title + '</b><span>' + text + '</span></span></button></li>';
    }
    return '<section class="sec" aria-label="Primeros pasos"><div class="sec-head"><h2>Primeros pasos</h2></div><ol class="steps">' +
      step(1, 'setup', !!cfg.desde, 'Ingresa el cupo y el utilizado', 'Lo que muestra hoy la app del banco.') +
      (canSync ? step(2, 'box', !!prefs.repo, 'Conecta el buzón de avisos', 'El mismo repositorio privado de GitHub que usa FAN.') +
                 step(3, 'box', false, 'Revisa la automatización de Atajos', 'Es la misma de FAN: solo con el remitente del banco, sin condición de asunto.')
               : step(2, 'paste', false, 'Pega tu primer aviso', 'Copia el texto del correo del banco y la app extrae los datos.')) +
      '</ol></section>';
  }

  function totalsBlock(c) {
    var t = c.t, sum = t.T + t.A;
    function tile(k) {
      var n = t['n' + k];
      return '<div class="tile ' + k + '"><span class="who"><i></i>' + WHO[k] + '</span><b>' + money(t[k]) + '</b>' +
        '<small>' + (n ? n + ' ' + plural(n, 'compra', 'compras') : 'Sin compras') + (DIG[k] ? ' · ··' + DIG[k] : '') + '</small></div>';
    }
    var h = '<section class="sec" aria-label="Totales por tarjeta"><div class="sec-head"><h2>Por tarjeta</h2><span class="sec-note">Desde el ' + fmt(cfg.desde) + '</span></div>';
    if (sum > 0) {
      h += '<div class="split" role="img" aria-label="Titular ' + Math.round(t.T / sum * 100) + '%, Adicional ' + Math.round(t.A / sum * 100) + '% de las compras">' +
        (t.T ? '<i class="T" style="flex:' + t.T + ' 1 0"></i>' : '') + (t.A ? '<i class="A" style="flex:' + t.A + ' 1 0"></i>' : '') + '</div>';
    }
    h += '<div class="tiles">' + tile('T') + tile('A') + '</div>';
    if (t.ng || t.na) {
      h += '<dl class="sums"><div><dt>Cargos</dt><dd>' + money(t.g) + '</dd></div><div><dt>Abonos</dt><dd class="in">' + (t.a ? '+' : '') + money(t.a) + '</dd></div></dl>';
    }
    return h + '<button class="btn tonal block" data-act="extract">' + I_DOC + 'Generar extracto</button></section>';
  }

  function cuotaBar(m, st) {
    var h = '<div class="cq-bar" role="img" aria-label="' + st.done + ' de ' + m.n + ' ' + plural(m.n, 'cuota cobrada', 'cuotas cobradas') + '">';
    if (m.n <= 24) { for (var i = 1; i <= m.n; i++) h += '<i' + (i <= st.done ? ' class="on"' : i === st.done + 1 ? ' class="cur"' : '') + '></i>'; }
    else h += (st.done ? '<i class="on" style="flex:' + st.done + ' 1 0"></i>' : '') + (st.pend ? '<i class="cur" style="flex:1 1 0"></i>' : '') + (st.pend > 1 ? '<i style="flex:' + (st.pend - 1) + ' 1 0"></i>' : '');
    return h + '</div>';
  }
  function cuotaWhen(st) {
    if (!st.pend) return 'Se cobró hasta la facturación de ' + monthName(st.end);
    return st.pend === 1 ? 'Se cobra en la facturación de ' + monthName(st.next)
      : 'Próxima en la facturación de ' + monthName(st.next) + ' · última en la de ' + monthName(st.end);
  }
  function cuotaCard(m) {
    var st = cuotaState(m), done = !st.pend, q = m.type === 'q';
    return '<li class="cq' + (done ? ' done' : '') + '">' +
      '<button class="cq-head" data-act="edit" data-id="' + m.id + '" aria-label="Editar: ' + esc(m.desc) + '">' +
      '<span class="store">' + esc(m.desc) + '</span><span class="amt">' + money(m.amount) + '</span>' +
      '<span class="meta"><span class="pill ' + m.who + '">' + WHO[m.who] + '</span>' +
      (q ? 'Cuotas de una compra anterior' : fmtFull(m.date) + ' · ' + m.n + ' cuotas de ' + money(cuotaVal(m))) + '</span></button>' +
      (m.n > 1 ? cuotaBar(m, st) : '') +
      '<dl class="cq-nums">' + (q ? '' : '<div><dt>Cobradas</dt><dd>' + st.done + ' de ' + m.n + '</dd></div>') +
      '<div><dt>Por cobrar' + (st.pend ? ' · ' + st.pend + ' ' + plural(st.pend, 'cuota', 'cuotas') : '') + '</dt><dd>' + money(st.pendAmt) + '</dd></div>' +
      (st.pend > 1 ? '<div><dt>Próxima cuota</dt><dd>' + money(st.nextAmt) + '</dd></div>' : '') + '</dl>' +
      '<p class="cq-when">' + cuotaWhen(st) + '</p></li>';
  }
  function cuotasBlock() {
    var q = cuotasInfo(), any = q.active.length + q.done.length;
    var h = '<section class="sec" aria-label="Cuotas pendientes"><div class="sec-head"><h2>Cuotas pendientes</h2>' +
      '<button class="btn ghost small" data-act="add-q">' + I_PLUS + 'Agregar</button></div>';
    if (!any) {
      return h + '<p class="empty">No hay cuotas pendientes. Una compra en cuotas se anota como compra, indicando sus cuotas. Las cuotas que quedan de compras anteriores se agregan aquí.</p></section>';
    }
    if (q.active.length) {
      h += '<dl class="cq-total"><div><dt>Por cobrar</dt><dd>' + money(q.pendAmt) + '</dd></div><div><dt>Cuotas</dt><dd>' + q.pendN + '</dd></div></dl>';
      h += '<ul class="cuotas">' + q.active.slice().reverse().map(cuotaCard).join('') + '</ul>';
      h += '<p class="muted fine">Cada cuota se cobra en la facturación de su mes. Lo que falta por cobrar ya está dentro del utilizado.</p>';
    } else {
      h += '<p class="empty">No quedan cuotas por cobrar.</p>';
    }
    if (q.done.length) {
      h += '<details class="fold" id="d-done"><summary>Terminadas (' + q.done.length + ')</summary><ul class="cuotas">' + q.done.slice().reverse().map(cuotaCard).join('') + '</ul></details>';
    }
    return h + '</section>';
  }

  function rowHtml(m) {
    var isIn = m.type === 'a', on = counts(m);
    var icon = isIn ? I_IN : m.type === 'g' ? I_OUT : I_BAG;
    var what = isIn ? 'Abono' : m.type === 'g' ? 'Cargo' : 'Compra';
    var amt = (isIn ? '+' : '−') + '$' + dots(m.amount);
    var meta = dayLabel(m.date) + (m.time ? ' · ' + m.time : '') + (m.n > 1 ? ' · ' + m.n + ' cuotas' : '');
    var tag = m.type === 'c' ? '<span class="pill ' + m.who + '">' + WHO[m.who] + '</span>' : '<span class="kind">' + what + '</span>';
    return '<li><button class="row' + (on ? '' : ' old') + '" data-act="edit" data-id="' + m.id + '" aria-label="Editar ' + what.toLowerCase() + ': ' + esc(m.desc) + ', ' + amt + ', ' + fmt(m.date) + (m.who ? ', ' + WHO[m.who] : '') + '">' +
      '<span class="ico' + (isIn ? ' in' : '') + '">' + icon + '</span>' +
      '<span class="info"><span class="store">' + esc(m.desc) + (fresh[m.id] ? '<span class="pill new">Nueva</span>' : '') + '</span><span class="meta">' + meta + '</span></span>' +
      '<span class="nums"><span class="amt' + (isIn ? ' in' : '') + '">' + amt + '</span>' + tag + '</span></button></li>';
  }

  function matches(m) { return filter === 'all' || (filter === 'o' ? m.type !== 'c' : m.type === 'c' && m.who === filter); }
  // Movimientos: compras, cargos y abonos (las cuotas por cobrar de compras anteriores están en «Cuotas pendientes»)
  function listBlock() {
    var list = items.filter(function (m) { return m.type !== 'q'; }), has = { T: 0, A: 0, o: 0 };
    list.forEach(function (m) { has[m.type === 'c' ? m.who : 'o']++; });
    var kinds = (has.T ? 1 : 0) + (has.A ? 1 : 0) + (has.o ? 1 : 0);

    var h = '<section class="sec" aria-label="Movimientos"><div class="sec-head"><h2>Movimientos</h2>';
    if (list.length > 1) h += '<button class="btn ghost small" data-act="order" aria-label="Cambiar el orden del listado">' + I_SORT + (prefs.order === 'desc' ? 'Recientes primero' : 'Antiguos primero') + '</button>';
    h += '</div>';
    if (kinds < 2 || (filter !== 'all' && !has[filter])) filter = 'all';
    if (kinds > 1) {
      h += '<div class="chips" role="group" aria-label="Filtrar movimientos">' +
        [['all', 'Todos', 1], ['T', 'Titular', has.T], ['A', 'Adicional', has.A], ['o', 'Cargos y abonos', has.o]].map(function (f) {
          return f[2] ? '<button class="chip" data-act="filter" data-f="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>' : '';
        }).join('') + '</div>';
    }
    if (!list.length) return h + '<p class="empty">Aún no hay movimientos desde el ' + fmt(cfg.desde || todayKey()) + '.</p></section>';

    // Lista en orden cronológico, con la marca del saldo anterior en su lugar
    var seq = [], mark = cfg.desde ? { h: '<li class="anchor"><span>Saldo anterior al ' + fmt(cfg.desde) + ' · ' + money(cfg.saldo) + '</span></li>' } : null, put = false;
    list.forEach(function (m) {
      if (mark && !put && m.date >= cfg.desde) { seq.push(mark); put = true; }
      if (matches(m)) seq.push(m);
    });
    if (mark && !put) seq.push(mark);
    if (prefs.order === 'desc') seq.reverse();
    var total = seq.length, cut = seq.slice(0, shown);
    h += '<ul class="list">' + cut.map(function (r) { return r.h || rowHtml(r); }).join('') + '</ul>';
    if (total > shown) h += '<button class="btn ghost block" data-act="more">Ver más movimientos (' + (total - shown) + ')</button>';
    if (cfg.desde) h += '<button class="btn ghost block" data-act="purge">Borrar registros anteriores a una fecha</button>';
    return h + '</section>';
  }

  function dataBlock() {
    var where = mode === 'db' ? 'Los movimientos se guardan en este artefacto de Claude.' : 'Los movimientos se guardan solo en este dispositivo.';
    return '<details class="backup" id="d-backup"><summary>Datos y respaldo</summary>' +
      '<p class="muted">' + where + ' Copia un respaldo para guardarlo en Notas o llevarlo a otro equipo.</p>' +
      '<textarea id="bk-text" rows="4" spellcheck="false" aria-label="Texto del respaldo"></textarea>' +
      '<div class="bk-actions"><button class="btn ghost" data-act="bk-copy">Copiar respaldo</button><button class="btn ghost" data-act="bk-restore">Restaurar desde el texto</button></div>' +
      '<button class="btn danger block" data-act="wipe"' + (items.length || cfg.desde ? '' : ' disabled') + '>Borrar todos los datos</button></details>';
  }

  function render() {
    var c = compute();
    var h = header() + hero(c);
    if (!loading) {
      h += actions();
      if (items.length) h += (cfg.desde ? totalsBlock(c) : '') + cuotasBlock() + listBlock();
      else h += startBlock();
      h += dataBlock();
    }
    h += '<p class="foot">Registro personal. No es la app oficial del banco ni está conectada a tu tarjeta.</p>';
    var open = {}, bk = document.getElementById('bk-text'), bkVal = bk ? bk.value : '';
    Array.prototype.forEach.call(app.querySelectorAll('details[id]'), function (d) { if (d.open) open[d.id] = 1; });
    app.innerHTML = h;
    restoreArmed = false; wipeArmed = false;
    queueWidget();
    Object.keys(open).forEach(function (id) { var d = document.getElementById(id); if (d) d.open = true; });
    if (open['d-backup'] && bkVal) { var nb = document.getElementById('bk-text'); if (nb) nb.value = bkVal; }
  }

  /* ---------- Hojas ---------- */
  function moneyField(id, label, value, hint) {
    return '<label class="field"><span id="' + id + '-label">' + label + '</span><div class="price-wrap"><b>$</b><input type="text" id="' + id + '" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="' + hint + '" value="' + value + '"></div></label>';
  }
  function stepField(id, label, value) {
    return '<div class="field"><span id="' + id + '-label">' + label + '</span><div class="stepper">' +
      '<button type="button" data-act="step" data-for="' + id + '" data-d="-1" aria-label="Menos">' + I_MINUS + '</button>' +
      '<input type="text" id="' + id + '" inputmode="numeric" autocomplete="off" maxlength="2" aria-labelledby="' + id + '-label" value="' + value + '">' +
      '<button type="button" data-act="step" data-for="' + id + '" data-d="1" aria-label="Más">' + I_PLUS + '</button></div></div>';
  }
  function beforeNote(date) {
    return cfg.desde && validDate(date) && date < cfg.desde
      ? 'Es anterior al ' + fmtFull(cfg.desde) + ': lo anterior a ese día ya está dentro del saldo anterior.' : '';
  }
  var KIND = {
    c: { hint: 'Compra con la tarjeta. Resta del disponible.', ph: 'Nombre del comercio', label: 'Comercio', amount: 'Monto total', save: 'Guardar compra',
      n: 'Cuotas', month: 'La cuota 1 se cobra en la facturación de' },
    g: { hint: 'Un cobro de la tarjeta: comisión, interés, seguro, impuesto. Resta del disponible.', ph: 'Ej. Comisión mensual, intereses', label: 'Descripción', amount: 'Monto', save: 'Guardar cargo' },
    a: { hint: 'Un pago de la tarjeta o una devolución. Suma al disponible.', ph: 'Ej. Pago de la tarjeta, devolución', label: 'Descripción', amount: 'Monto', save: 'Guardar abono' },
    q: { hint: 'Lo que falta por cobrar de una compra en cuotas hecha antes del saldo anterior. Ocupa cupo hasta que se paga.', ph: 'Nombre del comercio', label: 'Comercio',
      amount: 'Monto por cobrar', save: 'Guardar cuotas', n: 'Cuotas por cobrar', month: 'La próxima se cobra en la facturación de' }
  };

  function sheetMove(s) {
    var today = todayKey(), p = s.id ? find(s.id) : null;
    var type = s.type, mail = !!p && p.src === 'mail', k = KIND[type], q = type === 'q';
    var title = p ? (mail ? 'Compra del aviso' : q ? 'Cuotas por cobrar' : type === 'a' ? 'Editar abono' : type === 'g' ? 'Editar cargo' : 'Editar compra') : q ? 'Cuotas por cobrar' : 'Anotar movimiento';
    var dateV = p ? p.date : today, timeV = p ? p.time : '';
    var note = beforeNote(dateV);
    var h = '<form class="panel" id="sheet-form" novalidate role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' +
      '<h2 id="sheet-title">' + title + '</h2>';
    if (mail) h += '<p class="sub">Leída del aviso del banco' + (p.card ? ', tarjeta ··' + p.card : '') + '. Puedes corregirla, darle un nombre más claro o indicar sus cuotas.</p>';
    else if (q) h += '<p class="sub">' + k.hint + '</p>';
    else if (!p) h += '<div class="seg three" role="group" aria-label="Tipo de movimiento">' +
      '<button type="button" data-act="type" data-t="c" aria-pressed="' + (type === 'c') + '">Compra</button>' +
      '<button type="button" data-act="type" data-t="g" aria-pressed="' + (type === 'g') + '">− Cargo</button>' +
      '<button type="button" data-act="type" data-t="a" aria-pressed="' + (type === 'a') + '">+ Abono</button></div>' +
      '<p class="sub" id="f-hint">' + k.hint + '</p>';
    h += moneyField('f-amount', k.amount, p ? dots(p.amount) : '', 'Ej. 150.000') +
      '<label class="field"><span id="f-desc-label">' + k.label + '</span><input type="text" id="f-desc" list="f-descs" maxlength="60" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" placeholder="' + k.ph + '" value="' + (p ? esc(p.desc) : '') + '"></label>' +
      '<datalist id="f-descs">' + descOptions(type).map(function (x) { return '<option value="' + esc(x) + '"></option>'; }).join('') + '</datalist>' +
      '<div class="stack" id="f-buy"' + (type === 'c' || q ? '' : ' hidden') + '>' +
      '<div class="field"><span>Tarjeta</span><div class="seg" role="group" aria-label="Tarjeta">' +
      ['T', 'A'].map(function (w) { return '<button type="button" data-act="who" data-w="' + w + '" aria-pressed="' + (s.who === w) + '">' + WHO[w] + '</button>'; }).join('') + '</div></div>' +
      stepField('f-n', q ? KIND.q.n : KIND.c.n, p ? p.n : s.n) +
      '<div class="field" id="f-prox-wrap"><span id="f-prox-label">' + (q ? KIND.q.month : KIND.c.month) + '</span><div class="stepper">' +
      '<button type="button" data-act="month" data-d="-1" aria-label="Mes anterior">' + I_MINUS + '</button>' +
      '<output class="step-val" id="f-prox" aria-labelledby="f-prox-label">' + monthName(s.prox) + '</output>' +
      '<button type="button" data-act="month" data-d="1" aria-label="Mes siguiente">' + I_PLUS + '</button></div></div>' +
      '<p class="note" id="f-cuota"></p></div>';
    if (!q) {
      h += '<div class="pair"><label class="field"><span>Fecha</span><input type="date" id="f-date" value="' + dateV + '"' + (cfg.desde && !(p && p.date < cfg.desde) ? ' min="' + cfg.desde + '"' : '') + ' max="' + today + '" required></label>' +
        '<label class="field"><span>Hora (opcional)</span><input type="time" id="f-time" value="' + timeV + '"></label></div>' +
        '<p class="note" id="f-note"' + (note ? '' : ' hidden') + '>' + note + '</p>';
    }
    h += '<p class="err" id="f-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="submit" class="btn primary block" id="f-save">' + (p ? 'Guardar cambios' : k.save) + '</button>' +
      (p ? '<button type="button" class="btn danger block" data-act="delete">' + (q ? 'Eliminar estas cuotas' : 'Eliminar movimiento') + '</button>' : '') +
      '<button type="button" class="btn ghost block" data-act="cancel">Cancelar</button></div></form>';
    return h;
  }
  // Valor de cada cuota y facturaciones en que se cobran; el mes solo se pide si hay cuotas
  function cuotaPreview() {
    var out = document.getElementById('f-cuota'), wrap = document.getElementById('f-prox-wrap'), lab = document.getElementById('f-prox');
    if (!out || !wrap || !sheet) return;
    var q = sheet.type === 'q', n = +val('f-n'), amount = +digits('f-amount'), ok = n >= (q ? 1 : 2) && n <= MAX_N;
    wrap.hidden = !ok;
    if (lab) lab.textContent = monthName(sheet.prox);

  /* ---------- Extracto ---------- */
  // Todo lo registrado desde el día «desde»: el saldo anterior, cada movimiento y el utilizado que resulta, más las
  // cuotas que faltan por cobrar. Los montos van como deuda: compras, cargos y cuotas en positivo, abonos en negativo.
  function extractData() {
    var c = compute(), d = { desde: cfg.desde, saldo: cfg.saldo, rows: c.rows, t: c.t, used: c.used, avail: c.avail, cuotas: [], pendAmt: 0, pendN: 0 };
    c.rows.forEach(function (m) {
      if (!isCuota(m)) return;
      var st = cuotaState(m);
      d.cuotas.push({ m: m, st: st });
      if (st.pend) { d.pendAmt += st.pendAmt; d.pendN += st.pend; }
    });
    return d;
  }
  function kindOf(m) {
    return m.type === 'c' ? WHO[m.who] + (m.n > 1 ? ' · ' + m.n + ' cuotas' : '') : m.type === 'q' ? 'Cuotas anteriores · ' + WHO[m.who] : m.type === 'g' ? 'Cargo' : 'Abono';
  }
  function buildExtract() {
    var d = extractData(), t = d.t, pend = d.cuotas.filter(function (x) { return x.st.pend; });
    function when(m) { return fmtNum(m.date) + (m.time ? ' ' + m.time : ''); }
    function cuotaLine(x) { return x.st.pend + ' de ' + x.m.n + ' ' + plural(x.m.n, 'cuota', 'cuotas') + ' por cobrar, ' + money(x.st.pendAmt) + ' · ' + cuotaWhen(x.st).toLowerCase(); }
    var saldoLbl = 'Saldo anterior al ' + fmtNum(d.desde);

    var L = ['MASTER · Extracto de la tarjeta', 'Movimientos desde el ' + fmtNum(d.desde), 'Generado el ' + fmtFull(todayKey()) + ', ' + nowTime(), '',
      'Cupo: ' + money(cfg.limit), 'Utilizado: ' + money(d.used), 'Disponible: ' + money(d.avail), '',
      saldoLbl.toUpperCase() + ': ' + money(d.saldo), '',
      'MOVIMIENTOS (' + d.rows.length + ')'];
    if (!d.rows.length) L.push('Sin movimientos.');
    d.rows.forEach(function (m, i) { L.push((i + 1) + '. ' + when(m) + ' · ' + m.desc + ' · ' + kindOf(m) + ' · ' + money(uses(m))); });
    L.push('', 'TOTALES',
      saldoLbl + ': ' + money(d.saldo),
      'Titular (' + t.nT + ' ' + plural(t.nT, 'compra', 'compras') + '): ' + money(t.T),
      'Adicional (' + t.nA + ' ' + plural(t.nA, 'compra', 'compras') + '): ' + money(t.A),
      'Cargos (' + t.ng + '): ' + money(t.g),
      'Abonos (' + t.na + '): ' + money(-t.a));
    if (t.nq) L.push('Cuotas de compras anteriores (' + t.nq + '): ' + money(t.q));
    L.push('UTILIZADO: ' + money(d.used));
    if (pend.length) {
      L.push('', 'CUOTAS PENDIENTES');
      pend.forEach(function (x) { L.push(x.m.desc + ' · ' + WHO[x.m.who] + ' · ' + cuotaLine(x)); });
      L.push('Por cobrar en cuotas: ' + money(d.pendAmt) + ' (ya incluido en el utilizado)');
    }

    function li(m) { return '<li><b>' + esc(m.desc) + '</b><i' + (m.type === 'a' ? ' class="in"' : '') + '>' + money(uses(m)) + '</i><span>' + fmtFull(m.date) + (m.time ? ', ' + m.time : '') + ' · ' + kindOf(m) + '</span></li>'; }
    var h = '<dl class="ext-kv"><div><dt>Cupo</dt><dd>' + money(cfg.limit) + '</dd></div><div><dt>Utilizado</dt><dd>' + money(d.used) + '</dd></div><div><dt>Disponible</dt><dd>' + money(d.avail) + '</dd></div></dl>' +
      '<h3>Movimientos (' + d.rows.length + ')</h3><ul class="ext-list">' +
      '<li><b>Saldo anterior</b><i>' + money(d.saldo) + '</i><span>Lo utilizado antes del ' + fmtFull(d.desde) + '</span></li>' +
      d.rows.map(li).join('') + '</ul>' +
      '<h3>Totales</h3><dl class="ext-kv">' +
      '<div><dt>Saldo anterior</dt><dd>' + money(d.saldo) + '</dd></div>' +
      '<div><dt>Titular · ' + t.nT + ' ' + plural(t.nT, 'compra', 'compras') + '</dt><dd>' + money(t.T) + '</dd></div>' +
      '<div><dt>Adicional · ' + t.nA + ' ' + plural(t.nA, 'compra', 'compras') + '</dt><dd>' + money(t.A) + '</dd></div>' +
      '<div><dt>Cargos · ' + t.ng + '</dt><dd>' + money(t.g) + '</dd></div>' +
      '<div><dt>Abonos · ' + t.na + '</dt><dd class="in">' + money(-t.a) + '</dd></div>' +
      (t.nq ? '<div><dt>Cuotas de compras anteriores · ' + t.nq + '</dt><dd>' + money(t.q) + '</dd></div>' : '') + '</dl>' +
      '<div class="ext-total"><span>Utilizado</span><b>' + money(d.used) + '</b></div>';
    if (pend.length) {
      h += '<h3>Cuotas pendientes</h3><ul class="ext-list">' +
        pend.map(function (x) { return '<li><b>' + esc(x.m.desc) + '</b><i>' + money(x.st.pendAmt) + '</i><span>' + WHO[x.m.who] + ' · ' + cuotaLine(x) + '</span></li>'; }).join('') + '</ul>' +
        '<p class="note">Quedan <strong>' + money(d.pendAmt) + '</strong> por cobrar en cuotas. Ya están dentro del utilizado.</p>';
    }
    return { data: d, html: h, text: L.join('\n') };
  }
  function sheetExtract(s) {
    var ex = buildExtract();
    s.text = ex.text; s.ex = ex.data;

      '<h2 id="sheet-title">Extracto</h2>' +
      '<p class="sub">Movimientos desde el ' + fmtFull(cfg.desde) + '. Generado el ' + fmtFull(todayKey()) + ', ' + nowTime() + '.</p>' +
      ex.html +
      '<div class="stack"><button type="button" class="btn primary block" data-act="ext-copy">Copiar extracto</button>' +
      (!hasHost || saver ? '<button type="button" class="btn tonal block" data-act="ext-xlsx">Exportar a Excel</button>' : '') +
      (canShare ? '<button type="button" class="btn tonal block" data-act="ext-share">Compartir</button>' : '') +

  /* ---------- Exportar el extracto a Excel ---------- */
  // Un .xlsx es un ZIP con unas pocas hojas en XML. Se arma aquí mismo, sin bibliotecas, para que también
  // funcione sin conexión. Hojas: Resumen, Movimientos (una fila por movimiento, lista para filtrar) y Cuotas.
  var XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  var XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';

  // ZIP sin compresión: por cada archivo, cabecera local y datos; al final, el directorio central y el cierre

      var lh = record(0x04034b50, 30);
      lh.setUint16(4, 20, true); lh.setUint16(10, time, true); lh.setUint16(12, date, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
      var ch = record(0x02014b50, 46);
      ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);

  function xesc(v) {

      x += '<cols>' + widths.map(function (w, i) { return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>'; }).join('') + '</cols><sheetData>';
      rows.forEach(function (row, r) {

          var open = '<c r="' + colName(i) + (r + 1) + '"' + (cell.s ? ' s="' + cell.s + '"' : '');

        });

      if (opts.filter) x += '<autoFilter ref="' + opts.filter + '"/>';

    }

    var resumen = [
      [{ v: 'Master · Extracto de la tarjeta de crédito', s: TT }],
      ['Movimientos desde el ' + fmtFull(d.desde) + ' · generado el ' + fmtFull(todayKey()) + ', ' + nowTime()],
      [],
      [h('Resumen'), h('Monto')],
      ['Cupo', money$(cfg.limit)],
      [{ v: 'Utilizado', s: B }, money$(d.used, true)],
      ['Disponible', money$(d.avail)],
      [],
      [h('Detalle del utilizado'), h('Monto'), h('Cantidad')],
      [saldoLbl, money$(d.saldo)],
      ['Compras Titular', money$(t.T), t.nT],
      ['Compras Adicional', money$(t.A), t.nA],
      ['Cargos', money$(t.g), t.ng],
      ['Abonos', money$(0 - t.a), t.na],

    d.rows.forEach(function (m, i) {

      mov.push([i + 1, { v: excelDate(m.date), s: D }, m.time ? { v: excelTime(m.time), s: T } : '', m.desc,
        m.type === 'c' ? 'Compra' : m.type === 'q' ? 'Cuotas anteriores' : m.type === 'g' ? 'Cargo' : 'Abono', buy ? WHO[m.who] : '', buy ? m.n : '', money$(uses(m))]);
    });
    var cuo = [[h('Comercio'), h('Tarjeta'), h('Tipo'), h('Monto'), h('Cuotas'), h('Valor cuota'), h('Primera facturación'), h('Última facturación'),
      h('Cobradas'), h('Por cobrar'), h('Monto por cobrar'), h('Próxima facturación'), h('Estado')]];
    d.cuotas.forEach(function (x) {
      var m = x.m, st = x.st;
      cuo.push([m.desc, WHO[m.who], m.type === 'q' ? 'Cuotas anteriores' : 'Compra en cuotas', money$(m.amount), m.n, money$(cuotaVal(m)), monthName(m.prox), monthName(st.end),
        st.done, st.pend, money$(st.pendAmt), st.next ? monthName(st.next) : '', st.pend ? 'Por cobrar' : 'Terminada']);
    });

    var sheets = [
      { name: 'Resumen', xml: sheetXml(resumen, [46, 16, 11]) },
      { name: 'Movimientos', xml: sheetXml(mov, [6, 12, 8, 38, 18, 12, 8, 14], { freeze: true, filter: 'A1:H' + mov.length }) }
    ];
    if (cuo.length > 1) sheets.push({ name: 'Cuotas', xml: sheetXml(cuo, [34, 11, 18, 14, 8, 13, 20, 20, 10, 10, 16, 20, 11], { freeze: true }) });

    var fmt$ = '&quot;$&quot;#,##0;\\-&quot;$&quot;#,##0';
    var styles = XML_HEAD + '<styleSheet xmlns="' + NS_MAIN + '"><numFmts count="2"><numFmt numFmtId="164" formatCode="' + fmt$ + '"/><numFmt numFmtId="165" formatCode="hh:mm"/></numFmts>' +
      '<fonts count="3"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="14"/><name val="Calibri"/><family val="2"/></font></fonts>' +
      '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDFE9FD"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
      '<xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>' +

      { name: 'xl/workbook.xml', text: XML_HEAD + '<workbook xmlns="' + NS_MAIN + '" xmlns:r="' + NS_REL + '"><bookViews><workbookView/></bookViews><sheets>' +
        sheets.map(function (sh, i) { return '<sheet name="' + xesc(sh.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>'; }).join('') + '</sheets>' +
        '<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="1" hidden="1">Movimientos!$A$1:$H$' + mov.length + '</definedName></definedNames></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', text: XML_HEAD + '<Relationships xmlns="' + NS_PKG + '">' +
        sheets.map(function (sh, i) { return '<Relationship Id="rId' + (i + 1) + '" Type="' + NS_REL + '/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>'; }).join('') +
        '<Relationship Id="rId' + (n + 1) + '" Type="' + NS_REL + '/styles" Target="styles.xml"/><Relationship Id="rId' + (n + 2) + '" Type="' + NS_REL + '/sharedStrings" Target="sharedStrings.xml"/></Relationships>' }

  // Entrega el archivo: en el teléfono, por la hoja de compartir (guardar en Archivos, abrir en Excel, enviar);
  // en un computador, como descarga; dentro de Claude, a través de la app, que pide confirmación.
  async function exportExcel() {
    var d = sheet && sheet.ex, blob, name = 'Extracto Master ' + todayKey() + '.xlsx';

    if (hasHost) {
      if (!saver) { toast('Aquí no se puede guardar el archivo. Usa la app instalada desde GitHub.', null, null, 5200); return; }
      try { await saver.save({ filename: name, data: blob }); toast('Extracto guardado en Excel'); }
      catch (e) { if (!e || e.code !== 'declined') toast(e && e.code === 'rate_limited' ? 'Ya hay un archivo esperando tu confirmación.' : 'No se pudo guardar el archivo aquí.'); }

  function renderSheet() {
    var s = sheet, h = '<div class="backdrop" data-act="cancel"></div>';
    if (s.mode === 'setup') h += sheetSetup();
    else if (s.mode === 'paste') h += sheetPaste();
    else if (s.mode === 'box') h += sheetBox();
    else if (s.mode === 'extract') h += sheetExtract(s);
    else if (s.mode === 'purge') h += sheetPurge();
    else if (s.mode === 'away') h += sheetAway();
    else h += sheetMove(s);
    sheetEl.innerHTML = h;
    cuotaPreview();
    if (s.mode === 'setup') setupPreview();
  }

  // Mantiene la hoja dentro del área visible cuando aparece el teclado del teléfono
  function fitSheet() {
    var vv = window.visualViewport;
    if (!vv || sheetEl.hidden) return;
    sheetEl.style.top = vv.offsetTop + 'px';
    sheetEl.style.bottom = 'auto';
    sheetEl.style.height = vv.height + 'px';
  }
  function openSheet(m, id, opts) {
    var p = m === 'edit' ? find(id) : null;
    if (m === 'edit' && !p) return;
    if ((m === 'extract' || m === 'purge') && !cfg.desde) return;
    opts = opts || {};
    sheet = { mode: m, id: id || null, del: false, testing: false, text: '', widget: !!opts.widget,
      type: p ? p.type : opts.type || 'c', who: p && p.who ? p.who : 'T', n: opts.n || 1,
      // Mes de la facturación que cobra la (próxima) cuota: el guardado o, mientras no se toque, el sugerido por la fecha
      prox: p && p.prox ? p.prox : proxFor(p ? p.date : todayKey()), proxAuto: !(p && p.prox) };
    renderSheet();
    sheetEl.hidden = false;
    document.documentElement.classList.add('lock');
    toastEl.hidden = true;
    fitSheet();
    var target = document.getElementById(m === 'add' ? 'f-amount' : m === 'setup' ? 'f-used' : m === 'paste' ? 'f-paste' : 'sheet-form');
    if (target) target.focus();
    if (m === 'box' && prefs.repo && canSync) loadMails();
    if (opts.widget) { var wd = document.getElementById(prefs.repo ? 'f-widget' : 'f-repo'); if (wd && wd.scrollIntoView) wd.scrollIntoView({ block: 'start' }); }
  }
  function closeSheet() {
    sheet = null; sheetEl.hidden = true; sheetEl.innerHTML = '';
    sheetEl.style.top = ''; sheetEl.style.bottom = ''; sheetEl.style.height = '';
    document.documentElement.classList.remove('lock');
  }
  function setErr(msg) {
    var e = document.getElementById('f-err');
    if (!e) return;
    e.textContent = msg; e.hidden = !msg;
    if (msg && e.scrollIntoView) e.scrollIntoView({ block: 'nearest' });
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function digits(id) { return val(id).replace(/[.\s$]/g, ''); }

  async function saveMove() {
    var today = todayKey();
    var p = sheet.id ? find(sheet.id) : null;
    if (sheet.mode === 'edit' && !p) { closeSheet(); return; }
    var type = sheet.type, q = type === 'q';
    var raw = digits('f-amount'), desc = clean(val('f-desc'));
    var date = q ? (p ? p.date : (cfg.desde && cfg.desde > today ? cfg.desde : today)) : val('f-date'), time = q ? '' : val('f-time');
    if (!/^\d+$/.test(raw) || +raw <= 0) { setErr('Escribe el monto en pesos, por ejemplo 150000.'); return; }
    if (+raw > MAX_AMOUNT) { setErr('El monto es demasiado grande. Revisa los dígitos.'); return; }
    if (!validDate(date)) { setErr('Indica la fecha del movimiento.'); return; }
    if (!q && date > today) { setErr('La fecha no puede ser futura.'); return; }
    if (cfg.desde && date < cfg.desde && !(p && p.date === date)) { setErr('La fecha no puede ser anterior al ' + fmtFull(cfg.desde) + ': lo anterior ya está dentro del saldo anterior. Si el disponible no coincide, usa «Ajustar».'); return; }
    if (time && !TIME_RE.test(time)) { setErr('Revisa la hora, por ejemplo 13:04, o déjala vacía.'); return; }
    if (!desc && (q || (p && p.src === 'mail'))) { setErr('Escribe el nombre del comercio.'); return; }
    var n = 1;
    if (type === 'c' || q) {
      var rn = val('f-n').trim();
      if (!/^\d+$/.test(rn) || +rn < 1 || +rn > MAX_N) { setErr(q ? 'Indica cuántas cuotas faltan por cobrar, entre 1 y ' + MAX_N + '.' : 'Indica el número de cuotas, entre 1 y ' + MAX_N + '. Usa 1 si fue sin cuotas.'); return; }
      n = +rn;
      if (!q && n > 1 && sheet.prox < date.slice(0, 7)) { setErr('La cuota 1 no puede cobrarse antes del mes de la compra.'); return; }
    }
    var rec = { id: p ? p.id : genId(), type: type, date: date, time: time, desc: desc, amount: +raw, src: p ? p.src : 'manual', key: p ? p.key : '',
      card: p ? p.card : '', who: type === 'c' || q ? sheet.who : '', n: n, prox: q || n > 1 ? sheet.prox : '', ts: p ? p.ts : Date.now() };
    busy = true;
    var ok = await commit([rec], []);
    busy = false;
    if (!ok) return;
    closeSheet();
    if (p) toast('Cambios guardados');
    else if (q) toast('Cuotas por cobrar anotadas · ' + money(rec.amount));
    else if (type === 'a') toast('Abono anotado · +$' + dots(rec.amount));
    else toast((type === 'g' ? 'Cargo anotado · −$' : n > 1 ? 'Compra en ' + n + ' cuotas anotada · −$' : 'Compra anotada · −$') + dots(rec.amount));
  }

  async function saveSetup() {
    var u = digits('f-used'), l = digits('f-limit'), first = !cfg.desde, today = todayKey();
    if (!/^\d+$/.test(u)) { setErr('Escribe el utilizado que muestra el banco, en pesos, por ejemplo 850000. Si no hay nada utilizado, escribe 0.'); return; }
    if (!/^\d+$/.test(l) || +l <= 0) { setErr('Escribe el cupo de la tarjeta, por ejemplo 5000000.'); return; }
    if (+u > MAX_AMOUNT || +l > MAX_AMOUNT) { setErr('El monto es demasiado grande. Revisa los dígitos.'); return; }
    var msg = 'Utilizado ' + money(+u) + ' · disponible ' + money(+l - +u), ok;
    if (first) {
      var d = val('f-desde');
      if (!validDate(d)) { setErr('Indica desde qué día se registran los movimientos.'); return; }
      if (d > today) { setErr('Ese día no puede ser futuro.'); return; }
      // Lo anterior a ese día ya está dentro del utilizado del banco: se borra, y las cuotas que falten quedan como cuotas por cobrar
      var plan = purgePlan(d, { limit: +l, desde: d, saldo: +u - sumFrom(d), ignored: cfg.ignored });
      ok = await applyUndoable(plan.ups, plan.rems, plan.cfg, msg);
    } else {
      ok = await applyUndoable([], [], withCfg({ limit: +l, saldo: +u - (compute().used - cfg.saldo) }), msg);
    }
    if (ok) closeSheet();
  }

  function pastePreview() {
    var out = document.getElementById('f-found'), btn = document.getElementById('f-paste-add');
    if (!out || !btn) return;
    setErr('');
    var text = val('f-paste');
    var parsed = parseMail(text), res = pending(parsed, 'paste');
    var tag = { known: ' · Ya registrada', old: ' · Anterior al ' + (cfg.desde ? fmt(cfg.desde) : '') + ', ya está en el saldo', link: ' · Ya anotada a mano: se une al aviso', 'new': '' };
    out.innerHTML = parsed.found.map(function (p) {
      return '<li><b>' + esc(p.merchant) + '</b><i>' + money(p.amount) + '</i><span>' + fmt(p.date) + ', ' + p.time + ' · ' + WHO[p.who] + (p.n > 1 ? ' · ' + p.n + ' cuotas' : '') + (tag[res.st[p.key]] || '') + '</span></li>';
    }).join('');
    out.hidden = !parsed.found.length;
    var k = res.ups.length;
    btn.disabled = !k;
    btn.textContent = k > 1 ? 'Agregar ' + k + ' compras' : 'Agregar compra';
    if (!parsed.found.length && text.trim().length > 30) {
      setErr(parsed.other ? 'Ese aviso es de otra tarjeta' + (parsed.otherCard ? ' (··' + parsed.otherCard + ')' : '') + '. Aquí se registran ' + Object.keys(CARDS).map(function (d) { return '··' + d; }).join(' y ') + '.'
        : parsed.foreign ? 'Ese aviso es de una compra en dólares, que no usa el cupo en pesos.'
        : parsed.account ? 'Ese aviso es de una compra con cargo a la cuenta, no con la tarjeta de crédito.'
        : 'No reconozco un aviso de compra en ese texto. Revisa que esté completo, con el monto, la tarjeta, el comercio y la fecha.');
    }
  }

  sheetEl.addEventListener('click', async function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || !sheet) return;
    var a = b.getAttribute('data-act');
    if (a === 'cancel') { if (!busy && !sheet.testing) closeSheet(); return; }
    if (a === 'copy-sender') { copyText(SENDER, 'Remitente copiado'); return; }
    if (a === 'copy-url') { copyText(API + prefs.repo + '/issues', 'Dirección copiada'); return; }
    if (a === 'copy-auth') { copyText('Bearer ' + prefs.token, 'Autorización copiada'); return; }
    if (a === 'copy-mails') { copyText(sheet.mails || '', 'Detalle copiado'); return; }
    if (a === 'copy-widget') {
      copyText(WIDGET_CODE.replace('__REPO__', function () { return prefs.repo; }).replace('__TOKEN__', function () { return prefs.token; }), 'Script copiado. El widget quedó activado.');
      if (!prefs.widget) { prefs.widget = true; savePrefs(); }
      publishWidget();
      return;
    }
    if (a === 'widget-off') { await widgetOff(); closeSheet(); toast('Widget desactivado. Puedes quitarlo de la pantalla de inicio.'); return; }
    if (a === 'ext-copy') { copyText(sheet.text, 'Extracto copiado'); return; }
    if (a === 'ext-xlsx') { exportExcel(); return; }
    if (a === 'ext-share') {
      try { navigator.share({ title: 'Extracto Master', text: sheet.text }).catch(function () {}); } catch (e) { copyText(sheet.text, 'Extracto copiado'); }
      return;
    }
    if (a === 'paste-add') { importPaste(); return; }
    if (a === 'sync-now') { closeSheet(); syncBox(true, true); return; }   // desde aquí se repasa el buzón completo
    if (a === 'disconnect') {
      if (!sheet.del) { sheet.del = true; b.textContent = 'Toca de nuevo para desconectar'; b.classList.add('armed'); return; }
      if (prefs.widget) await widgetOff();
      prefs.repo = ''; prefs.token = ''; prefs.last = 0; prefs.note = null; prefs.other = ''; prefs.wm = 0; syncErr = ''; savePrefs();
      closeSheet(); render();
      toast('Buzón desconectado. Tus movimientos siguen aquí.');
      return;
    }
    if (a === 'type') {
      var t = b.getAttribute('data-t'), k = KIND[t];
      if (!k || sheet.id || t === 'q') return;
      sheet.type = t;
      Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-act="type"]'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-t') === t)); });
      var d = document.getElementById('f-desc'), dl = document.getElementById('f-descs');
      document.getElementById('f-hint').textContent = k.hint;
      document.getElementById('f-amount-label').textContent = k.amount;
      document.getElementById('f-desc-label').textContent = k.label;
      document.getElementById('f-save').textContent = k.save;
      document.getElementById('f-buy').hidden = t !== 'c';
      if (d) d.placeholder = k.ph;
      if (dl) dl.innerHTML = descOptions(t).map(function (x) { return '<option value="' + esc(x) + '"></option>'; }).join('');
      return;
    }
    if (a === 'who') {
      sheet.who = b.getAttribute('data-w') === 'A' ? 'A' : 'T';
      Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-act="who"]'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-w') === sheet.who)); });
      return;
    }
    if (a === 'step') {
      var inp = document.getElementById(b.getAttribute('data-for'));
      if (!inp) return;
      inp.value = Math.max(1, Math.min(MAX_N, (parseInt(inp.value, 10) || 0) + (+b.getAttribute('data-d'))));
      cuotaPreview();
      return;
    }
    if (a === 'month') {
      sheet.prox = addMonths(sheet.prox, +b.getAttribute('data-d') < 0 ? -1 : 1);
      sheet.proxAuto = false;
      cuotaPreview();
      return;
    }
    if (a === 'delete') {
      var p = sheet.id ? find(sheet.id) : null;
      if (!p) { closeSheet(); return; }
      if (!sheet.del) { sheet.del = true; b.textContent = 'Toca de nuevo para eliminar'; b.classList.add('armed'); return; }
      if (busy) return;
      var prev = cfg, next = null, snap = copyOf(p);
      if (p.key) next = withCfg({ ignored: cfg.ignored.filter(function (x) { return x !== p.key; }).concat(p.key).slice(-MAX_IGNORED) });
      busy = true;
      var ok = await commit([], [p.id], next);
      busy = false;
      if (ok) { closeSheet(); toast(p.type === 'q' ? 'Cuotas eliminadas' : 'Movimiento eliminado', 'Deshacer', function () { commit([snap], [], next ? prev : null); }, 6000); }
    }
  });

  sheetEl.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!sheet || busy) return;
    if (sheet.mode === 'setup') saveSetup();
    else if (sheet.mode === 'box') connectBox();
    else if (sheet.mode === 'purge') doPurge(document.getElementById('f-purge-go'));
    else if (sheet.mode === 'add' || sheet.mode === 'edit') saveMove();
  });

  sheetEl.addEventListener('input', function (ev) {
    var t = ev.target;
    if (!t || !sheet) return;
    if (t.id === 'f-amount' || t.id === 'f-used' || t.id === 'f-limit') {
      // El monto se muestra con separador de miles mientras se escribe
      var d = t.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 10);
      if (t.id !== 'f-used') d = d.replace(/^0+/, '');
      t.value = d ? dots(+d) : '';
      if (t.id === 'f-amount') cuotaPreview(); else setupPreview();
    } else if (t.id === 'f-n') {
      t.value = t.value.replace(/\D/g, '').slice(0, 2);
      cuotaPreview();
    } else if (t.id === 'f-paste') {
      pastePreview();
    } else if (t.id === 'f-purge') {
      purgePreview();
    } else if (t.id === 'f-desde') {
      setupPreview();
    } else if (t.id === 'f-date') {
      var n = document.getElementById('f-note'), msg = beforeNote(t.value);
      if (n) { n.textContent = msg; n.hidden = !msg; }
      if (sheet.proxAuto && validDate(t.value)) { sheet.prox = proxFor(t.value); cuotaPreview(); }
    }
  });

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && sheet && !busy && !sheet.testing) closeSheet(); });
  // Sin zoom con los dedos: Safari en iPhone no siempre respeta «user-scalable=no», así que se cortan sus gestos de zoom
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (ev) { ev.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (ev) { if (ev.touches && ev.touches.length > 1) ev.preventDefault(); }, { passive: false });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitSheet);
    window.visualViewport.addEventListener('scroll', fitSheet);
  }

  /* ---------- Acciones de la página ---------- */
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'add') openSheet('add', null, { type: KIND[b.getAttribute('data-t')] ? b.getAttribute('data-t') : 'c' });
    else if (a === 'add-q') openSheet('add', null, { type: 'q', n: 1 });
    else if (a === 'edit') openSheet('edit', b.getAttribute('data-id'));
    else if (a === 'setup') openSheet('setup');
    else if (a === 'paste') openSheet('paste');
    else if (a === 'box') openSheet('box');
    else if (a === 'widget') openSheet('box', null, { widget: true });
    else if (a === 'away') openSheet('away');
    else if (a === 'extract') openSheet('extract');
    else if (a === 'purge') openSheet('purge');
    else if (a === 'sync') syncBox(true);
    else if (a === 'order') { prefs.order = prefs.order === 'desc' ? 'asc' : 'desc'; savePrefs(); render(); }
    else if (a === 'filter') { filter = b.getAttribute('data-f'); shown = PAGE; render(); }
    else if (a === 'more') { shown += PAGE; render(); }
    else if (a === 'bk-copy') backupCopy();
    else if (a === 'bk-restore') backupRestore(b);
    else if (a === 'wipe') wipe(b);
  });

  function backupCopy() {
    var ta = document.getElementById('bk-text');
    var json = JSON.stringify({ app: 'master', v: 2, tarjeta: cfg, movimientos: items.map(function (m) { return copyOf(m); }) });
    ta.value = json;
    function manual() { ta.focus(); ta.select(); toast('Selecciona el texto y cópialo'); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(function () { toast('Respaldo copiado'); }, manual);
      else manual();
    } catch (e) { manual(); }
  }

  // Acepta los respaldos de esta versión y los de la anterior (deuda inicial con fecha y hora)
  async function backupRestore(btn) {
    var ta = document.getElementById('bk-text');
    var list = [], nextCfg;
    try {
      var data = JSON.parse(ta.value);
      if (!data || !Array.isArray(data.movimientos)) throw new Error('formato');
      data.movimientos.forEach(function (p) { var n = norm(p); if (n) list.push(n); });
      nextCfg = normCfg(data.tarjeta, list);
    } catch (e) { toast('El texto no es un respaldo válido'); return; }
    if (!list.length && !nextCfg.desde) { toast('El respaldo no tiene movimientos'); return; }
    if ((items.length || cfg.desde) && !restoreArmed) {
      restoreArmed = true; btn.textContent = 'Toca de nuevo para reemplazar';
      toast('Esto reemplaza los datos actuales');
      return;
    }
    if (busy) return;
    var keep = {};
    list.forEach(function (m) { keep[m.id] = 1; });
    busy = true;
    var ok = await commit(list, items.filter(function (m) { return !keep[m.id]; }).map(function (m) { return m.id; }), nextCfg);
    busy = false;
    if (!ok) return;
    toast('Respaldo restaurado');
    // El buzón se relee completo: los avisos de las compras del respaldo se unen a ellas y llegan los que falten
    if (canSync && prefs.repo) { prefs.last = 0; savePrefs(); syncBox(false, true); }
  }

  async function wipe(btn) {
    if (!wipeArmed) { wipeArmed = true; btn.textContent = 'Toca de nuevo para borrar todo'; btn.classList.add('armed'); return; }
    if (busy) return;
    var snap = items.map(function (m) { return copyOf(m); }), prev = cfg;
    busy = true;
    var ok = await commit([], snap.map(function (m) { return m.id; }), { limit: cfg.limit, desde: '', saldo: 0, ignored: [] });
    busy = false;
    if (ok) toast('Datos borrados', 'Deshacer', function () { commit(snap, [], prev); }, 9000);
  }

  /* ---------- Arranque ---------- */
  function fallback() { mode = 'local'; db = null; loading = false; loadLocal(); render(); }

  async function connect() {
    try {
      if (!hasHost) return;
      window.claude.use('downloads').then(function (d) { saver = d || null; }, function () {});
      db = await window.claude.use('db');
      if (!db) { fallback(); return; }
      mode = 'db';
      var ready = function () { cfg = normCfg(rawCfg, items); if (gotItems && gotCfg) loading = false; render(); };
      db.collection(COL).onSnapshot(function (snap) {
        var list = [];
        snap.docs.forEach(function (doc) {
          var n = norm(Object.assign({}, doc.data() || {}, { id: doc.id }));
          if (n) list.push(n);
        });
        items = list; sortItems(); gotItems = true; ready();
      }, function () { fallback(); });
      db.doc(CFG_PATH).onSnapshot(function (snap) {
        rawCfg = snap.exists ? snap.data() : null; gotCfg = true; ready();
      }, function () { fallback(); });
    } catch (e) { fallback(); }
  }

  loadPrefs();
  if (!loading) loadLocal();
  render();
  connect();
  if (canSync && prefs.repo) syncBox(false);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') autoSync(); });
  window.addEventListener('online', function () { if (syncErr) autoSync(); });

  if (!hasHost && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Master</title>
<!--STANDALONE:START-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Master">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!--STANDALONE:END-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Concepto: la tarjeta sobre la mesa. Arriba el cupo, en una tarjeta grafito con el medidor de lo utilizado en brasa;
   debajo las acciones (leer el buzón de avisos, anotar compra, cargo o abono), los totales por tarjeta, las compras
   en cuotas y el listado de movimientos. Grafito para las acciones, naranja para Titular, azul para Adicional,
   verde solo para lo que vuelve al cupo. */
:root {
  --bg: #f3f1ef;
  --surface: #ffffff;
  --ink: #1b1613;
  --muted: #6a5f58;
  --line: #ddd6d0;
  --track: #e9e4df;
  --seg-on: #ffffff;
  --accent: #241d19;
  --accent-bg: #ece6e1;
  --on-accent: #ffffff;
  --tit: #c2410c;
  --tit-ink: #a2360a;
  --tit-bg: #fde7db;
  --adi: #1d6fa5;
  --adi-ink: #17587f;
  --adi-bg: #deedf7;
  --in: #17713a;
  --in-bg: #e0f2e6;
  --over: #b42318;
  --over-bg: #fdecea;
  --card-a: #40362f;
  --card-b: #14110f;
  --card-edge: rgba(255, 255, 255, 0);
  --on-card: #ffffff;
  --on-card-muted: rgba(255, 255, 255, 0.8);
  --on-card-line: rgba(255, 255, 255, 0.2);
  --ember: #ff6a2b;
  --amber: #ffb65c;
  --alarm: #ff6b5e;
  --scrim: rgba(22, 16, 12, 0.5);
  --font-display: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131110;
    --surface: #1f1b19;
    --ink: #f1ece8;
    --muted: #ab9f97;
    --line: #38312d;
    --track: #2b2522;
    --seg-on: #4a403a;
    --accent: #f1ece8;
    --accent-bg: #2f2925;
    --on-accent: #1b1613;
    --tit: #ff8a4c;
    --tit-ink: #ffb590;
    --tit-bg: #43210f;
    --adi: #5aaee6;
    --adi-ink: #a3d2f3;
    --adi-bg: #14303f;
    --in: #74d394;
    --in-bg: #173322;
    --over: #ff9b92;
    --over-bg: #3b1f1d;
    --card-a: #3d342e;
    --card-b: #1d1917;
    --card-edge: rgba(255, 255, 255, 0.1);
    --on-card: #ffffff;
    --on-card-muted: rgba(255, 255, 255, 0.8);
    --on-card-line: rgba(255, 255, 255, 0.2);
    --ember: #ff6a2b;
    --amber: #ffb65c;
    --alarm: #ff6b5e;
    --scrim: rgba(0, 0, 0, 0.64);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131110;
  --surface: #1f1b19;
  --ink: #f1ece8;
  --muted: #ab9f97;
  --line: #38312d;
  --track: #2b2522;
  --seg-on: #4a403a;
  --accent: #f1ece8;
  --accent-bg: #2f2925;
  --on-accent: #1b1613;
  --tit: #ff8a4c;
  --tit-ink: #ffb590;
  --tit-bg: #43210f;
  --adi: #5aaee6;
  --adi-ink: #a3d2f3;
  --adi-bg: #14303f;
  --in: #74d394;
  --in-bg: #173322;
  --over: #ff9b92;
  --over-bg: #3b1f1d;
  --card-a: #3d342e;
  --card-b: #1d1917;
  --card-edge: rgba(255, 255, 255, 0.1);
  --on-card: #ffffff;
  --on-card-muted: rgba(255, 255, 255, 0.8);
  --on-card-line: rgba(255, 255, 255, 0.2);
  --ember: #ff6a2b;
  --amber: #ffb65c;
  --alarm: #ff6b5e;
  --scrim: rgba(0, 0, 0, 0.64);
  color-scheme: dark;
}
html.lock { overflow: hidden; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 480px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 18px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.muted { color: var(--muted); margin: 0; }
.fine { font-size: 14px; }
svg { display: block; }

/* Encabezado */
.top { display: flex; align-items: center; gap: 12px; }
.mark { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, var(--card-a), var(--card-b)); color: var(--amber); display: grid; place-items: center; flex: none; }
.top h1 { font-size: 28px; font-weight: 700; line-height: 1.1; }

/* Botones */
.btn {
  min-height: 52px; padding: 0 18px; border-radius: 14px; border: 1.5px solid transparent; box-sizing: border-box;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; cursor: pointer;
}
.btn:active { opacity: 0.85; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.tonal { background: var(--accent-bg); color: var(--ink); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.plus { background: transparent; border-color: var(--in); color: var(--in); }
.btn.danger { background: transparent; border-color: var(--over); color: var(--over); }
.btn.danger.armed { background: var(--over); color: var(--bg); }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.btn.block { width: 100%; }
.btn.big { min-height: 58px; font-size: 16px; border-radius: 16px; padding: 0 12px; }
.linkbtn { background: none; border: 0; padding: 0 6px; min-height: 44px; color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; align-self: center; }

/* Cupo: la tarjeta */
.hero {
  position: relative; overflow: hidden; border-radius: 24px; padding: 18px 20px 18px;
  background: linear-gradient(135deg, var(--card-a), var(--card-b)); color: var(--on-card);
  box-shadow: inset 0 0 0 1px var(--card-edge);
  display: flex; flex-direction: column; gap: 8px;
}
.hero::before {
  content: ""; position: absolute; left: -90px; bottom: -150px; width: 320px; height: 320px; border-radius: 50%;
  background: radial-gradient(closest-side, var(--ember), transparent); opacity: 0.3; pointer-events: none;
}
.hero-art { position: absolute; right: -4px; bottom: -10px; width: auto; height: 104px; opacity: 0.14; pointer-events: none; color: var(--amber); }
.hero > *:not(.hero-art) { position: relative; z-index: 1; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.hero .eyebrow { color: var(--on-card-muted); }
.hero-btn {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--on-card-line); background: transparent;
  color: var(--on-card); font-weight: 600; font-size: 14px; flex: none;
}
.hero-btn:active { opacity: 0.8; }
.hero-btn:focus-visible { outline-color: var(--on-card); }
.total {
  font-family: var(--font-display); font-weight: 700; line-height: 1; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere; margin: 2px 0;
}
.total.xl { font-size: min(60px, 15.5vw); }
.total.lg { font-size: min(50px, 13vw); }
.total.md { font-size: min(42px, 11vw); }
.total.sm { font-size: min(34px, 9vw); }
.total.word { font-size: min(34px, 9vw); letter-spacing: -0.02em; }
.meter { height: 10px; border-radius: 999px; background: var(--on-card-line); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; min-width: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--amber), var(--ember)); }
.meter.zero i { min-width: 0; }
.meter.full i { background: var(--alarm); }
.hero-note { margin: 0; font-size: 15px; font-weight: 500; color: var(--on-card-muted); }
.hero-note.warn { color: var(--amber); }
.hero-cta { align-self: flex-start; min-height: 46px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--amber); color: #2a1206; font-weight: 700; margin-top: 4px; }
.hero-stats { margin: 6px 0 0; padding-top: 12px; border-top: 1px solid var(--on-card-line); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hero-stats div { min-width: 0; }
.hero-stats dt { font-size: 13px; color: var(--on-card-muted); }
.hero-stats dd { margin: 2px 0 0; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-stats small { display: block; margin-top: 2px; font-size: 12px; line-height: 1.3; color: var(--on-card-muted); }

/* Acciones principales */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions .btn { min-width: 0; }
.sync { display: flex; align-items: center; justify-content: center; gap: 8px; margin: -8px 0 0; font-size: 14px; color: var(--muted); text-align: center; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--in); flex: none; }
.sync.busy i { background: var(--tit); }
.sync.bad { color: var(--over); font-weight: 600; }
.sync.bad i { background: var(--over); }
.sync.plain { display: block; margin: -6px 0 0; }
.under { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 14px; margin-top: -14px; }

/* Primeros pasos */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.step {
  width: 100%; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 12px 12px; min-height: 64px;
}
.step:active { background: var(--track); }
.step-n { width: 34px; height: 34px; border-radius: 999px; background: var(--accent-bg); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.step.done .step-n { background: var(--in-bg); color: var(--in); }
.step-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.step-t b { font-weight: 600; }
.step-t span { font-size: 14px; color: var(--muted); }

/* Secciones */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
.sec-head h2 { font-size: 22px; }
.sec-head .btn { flex: none; white-space: nowrap; }
.sec-note { font-size: 14px; color: var(--muted); text-align: right; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.T { background: var(--tit-bg); color: var(--tit-ink); }
.pill.A { background: var(--adi-bg); color: var(--adi-ink); }
.pill.new { background: var(--ink); color: var(--bg); margin-left: 6px; vertical-align: 1px; }

/* Totales por tarjeta */
.split { display: flex; gap: 3px; height: 10px; }
.split i { display: block; min-width: 6px; border-radius: 999px; }
.split .T { background: var(--tit); }
.split .A { background: var(--adi); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .who { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 15px; }
.tile .who i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.tile.T .who i { background: var(--tit); }
.tile.A .who i { background: var(--adi); }
.tile b { font-family: var(--font-display); font-weight: 700; font-size: min(26px, 6.6vw); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.15; }
.tile small { font-size: 14px; color: var(--muted); }
.sums { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.sums div { flex: 1 1 150px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 2px; min-width: 0; }
.sums dt { font-size: 14px; color: var(--muted); }
.sums dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sums dd.in { color: var(--in); }

/* Compras en cuotas */
.cuotas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cq { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.cq.done { background: transparent; }
.cq-head { width: 100%; text-align: left; background: none; border: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.cq-head .store { font-weight: 600; overflow-wrap: anywhere; }
.cq-head .amt { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cq-head .meta { grid-column: 1 / -1; }
.cq-bar { display: flex; gap: 3px; height: 10px; }
.cq-bar i { flex: 1 1 0; min-width: 0; border-radius: 3px; background: var(--track); }
.cq-bar i.on { background: var(--in); }
.cq-bar i.cur { background: var(--ink); }
.cq-nums { margin: 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; }
.cq-nums div { min-width: 0; }
.cq-nums dt { font-size: 13px; color: var(--muted); }
.cq-nums dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cq-when { margin: 0; font-size: 13px; color: var(--muted); }
.cq-total { margin: 0; padding: 12px 14px; border-radius: 16px; background: var(--accent-bg); display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.cq-total div { min-width: 0; }
.cq-total dt { font-size: 13px; color: var(--muted); }
.cq-total dd { margin: 0; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fold { border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; }
.fold summary { min-height: 48px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
.fold[open] { padding-bottom: 14px; }
.fold > *:not(summary) { margin-top: 4px; }

/* Listado */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-weight: 600; font-size: 15px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row {
  width: 100%; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 10px 10px; min-height: 62px;
}
.row:active { background: var(--track); }
.row.old { background: transparent; }
.ico { width: 38px; height: 38px; border-radius: 999px; background: var(--track); color: var(--muted); display: grid; place-items: center; flex: none; }
.ico.in { background: var(--in-bg); color: var(--in); }
.info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.store { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 14px; color: var(--muted); }
.cq-head .meta .pill { margin-right: 6px; }
.nums { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.amt { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.in { color: var(--in); }
.kind { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.anchor { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-weight: 600; text-align: center; padding: 4px 2px; }
.anchor::before, .anchor::after { content: ""; flex: 1; min-width: 12px; border-top: 1.5px dashed var(--line); }
.anchor span { min-width: 0; }
.empty { margin: 0; padding: 16px; border: 1.5px dashed var(--line); border-radius: 16px; color: var(--muted); }
.foot { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }

/* Datos y respaldo */
.backup { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; }
.backup summary { min-height: 48px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
.backup[open] { padding-bottom: 16px; }
.backup > *:not(summary) { margin-top: 10px; }
.backup textarea, .field textarea { width: 100%; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); padding: 10px 12px; font-size: 14px; resize: vertical; }
.backup textarea { font-family: ui-monospace, Menlo, monospace; }
.bk-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.bk-actions .btn { flex: 1; min-width: 0; min-height: 48px; }

/* Hojas */
.sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); }
.panel {
  position: relative; width: 100%; max-width: 480px; max-height: 94%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 24px 24px 0 0; box-sizing: border-box;
  padding: 22px 16px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px; animation: rise 0.2s ease-out;
}
.panel:focus { outline: none; }
.panel h2 { font-size: 24px; }
.panel h3 { font-size: 18px; }
.panel .sub { margin: -8px 0 0; color: var(--muted); font-size: 15px; }
.panel .sub strong, .note strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span { font-size: 14px; font-weight: 600; padding: 0; }
.field input[type="date"], .field input[type="time"], .field input[type="text"] {
  display: block; width: 100%; min-width: 0; min-height: 52px; box-sizing: border-box;
  -webkit-appearance: none; appearance: none; font-size: 16px;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--bg); color: var(--ink);
}
.field textarea { font-size: 16px; min-height: 104px; }
.field .hint { font-size: 14px; font-weight: 400; color: var(--muted); }
.pair { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 10px; }
.price-wrap { position: relative; }
.price-wrap b { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
.price-wrap input { padding-left: 30px !important; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 16px; background: var(--track); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { min-height: 44px; min-width: 0; border-radius: 12px; border: 0; background: transparent; font-weight: 600; color: var(--muted); padding: 0 4px; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); }
.stepper { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 8px; }
.stepper button { min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); display: grid; place-items: center; padding: 0; }
.stepper button:active { background: var(--track); }
.stepper input { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

<script>
(function () {
  'use strict';

  /* ---------- La tarjeta ---------- */
  // Últimos cuatro dígitos que trae el aviso del banco → de quién es la tarjeta.

  var LIMIT = 5000000;                 // cupo de la tarjeta, en pesos (se puede cambiar al ajustar la deuda)

  var toastEl = document.getElementById('toast');

  var cfg = { debt: 0, at: '', limit: LIMIT, ignored: [] };    // deuda inicial, desde cuándo, cupo y avisos descartados
  // De este dispositivo: orden del listado, buzón (repositorio y token), última lectura y lo último que el buzón dejó fuera
  var prefs = { order: 'desc', repo: '', token: '', last: 0, note: null, other: '' };
  var filter = 'all';                               // 'all' | 'T' titular | 'A' adicional | 'o' cargos y abonos

  var canSync = !hasHost;                           // dentro de Claude la página no puede llamar a GitHub
  var syncing = false, syncErr = '', lastTry = 0;
  var loading = hasHost;
  var gotItems = false, gotCfg = false;
  var mode = 'local';
  var db = null;
  var sheet = null;
  var busy = false;
  var restoreArmed = false;
  var wipeArmed = false;

  /* ---------- Fechas y formatos ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayKey() { return dayKey(new Date()); }
  function nowTime() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function validDate(k) {

  }
  function fmt(k) {
    var p = k.split('-');
    return (+p[2]) + ' ' + MES[+p[1] - 1] + (p[0] === todayKey().slice(0, 4) ? '' : ' ' + p[0]);
  }
  function fmtFull(k) { var p = k.split('-'); return (+p[2]) + ' ' + MES[+p[1] - 1] + ' ' + p[0]; }
  function fmtNum(k) { var p = k.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function dayLabel(k) {
    var t = new Date(), y = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1);
    if (k === dayKey(t)) return 'Hoy';

  }
  function fmtAt(at) { return fmt(at.slice(0, 10)) + ', ' + at.slice(11); }
  // Meses como 'aaaa-mm'
  function thisMonth() { return todayKey().slice(0, 7); }
  function addMonths(k, d) { var t = +k.slice(0, 4) * 12 + (+k.slice(5, 7) - 1) + d; return Math.floor(t / 12) + '-' + pad(t % 12 + 1); }

  function dots(n) { return String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function money(n) { return (n < 0 ? '−' : '') + '$' + dots(n); }
  function plural(n, s, p) { return n === 1 ? s : p; }
  function genId() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function clean(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 60); }

    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });

      var c = s.charCodeAt(i);

  /* ---------- Lector de los avisos del banco ---------- */
  // Formato del aviso: "Te informamos que se ha realizado una compra por $7.930 con Tarjeta de Crédito ****4526
  // en RedGloba*SU CASERO el 30/07/2026 09:34." El texto puede venir con etiquetas HTML, saltos de línea o varios
  // avisos seguidos. El buzón también recibe los avisos de la cuenta (los que usa FAN): esos se dejan pasar.
  function plainText(s) {
    s = String(s == null ? '' : s);
    if (s.length > 4000000) s = s.slice(-4000000);
    if (/<[a-z!\/][^>]*>/i.test(s)) s = s.replace(/<(script|style)\b[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]+>/g, ' ');
    if (/&[#a-z0-9]+;/i.test(s)) { var t = document.createElement('textarea'); t.innerHTML = s; s = t.value; }
    return s.replace(/[\s ​‌‍﻿]+/g, ' ');
  }
  function parseMail(raw) {
    var text = plainText(raw);
    var re = /compra(?:\s+en\s+(?:(\d{1,2})\s+)?cuotas?)?\s+por\s+(US\$|USD|\$)?\s?([\d.]+(?:,\d{1,2})?)(?:\s+en\s+(\d{1,2})\s+cuotas?)?\s+con\s+(?:cargo\s+a\s+)?(.{1,60}?)\s+en\s+(.{1,80}?)\s+el\s+(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/gi;

      var n = +(m[1] || m[4] || 1);

  }

  /* ---------- Datos ---------- */
  // Tipos: 'c' compra (con tarjeta Titular o Adicional, de contado o en cuotas), 'g' cargo de la tarjeta, 'a' abono.
  // Una compra en cuotas guarda en «first» el mes en que se paga la cuota 1; si falta, es el mes siguiente a la compra.
  function norm(p) {

    var amount = Math.round(+p.amount);
    if (!date || !(amount > 0) || amount > MAX_AMOUNT) return null;
    var type = p.type === 'a' ? 'a' : p.type === 'g' ? 'g' : 'c';

    var n = type === 'c' ? Math.min(MAX_N, Math.max(1, Math.round(+p.n) || 1)) : 1;

      type: type,
      date: date,
      time: TIME_RE.test(String(p.time)) ? String(p.time) : '12:00',
      desc: clean(p.desc) || (type === 'a' ? 'Abono' : type === 'g' ? 'Cargo' : 'Compra'),
      amount: amount,
      src: src,
      key: src === 'mail' ? String(p.key || '').slice(0, 180) : '',
      card: /^\d{4}$/.test(String(p.card || '')) ? String(p.card) : '',
      who: type === 'c' ? (p.who === 'A' ? 'A' : 'T') : '',
      n: n,
      first: n > 1 ? (YM_RE.test(String(p.first)) ? String(p.first) : addMonths(date.slice(0, 7), 1)) : '',

  }
  function toDoc(m) { return { type: m.type, date: m.date, time: m.time, desc: m.desc, amount: m.amount, src: m.src, key: m.key, card: m.card, who: m.who, n: m.n, first: m.first, ts: m.ts }; }
  function copyOf(m, changes) { var c = toDoc(m); c.id = m.id; Object.keys(changes || {}).forEach(function (k) { c[k] = changes[k]; }); return c; }
  function normCfg(c) {

    var debt = Math.round(+c.debt), limit = Math.round(+c.limit);
    var at = AT_RE.test(String(c.at)) && validDate(String(c.at).slice(0, 10)) ? String(c.at) : '';
    var ign = Array.isArray(c.ignored) ? c.ignored.filter(function (k) { return typeof k === 'string' && k; }).slice(-MAX_IGNORED) : [];
    return { debt: at && debt >= 0 && debt <= MAX_AMOUNT ? debt : 0, at: at, limit: limit > 0 && limit <= MAX_AMOUNT ? limit : LIMIT, ignored: ign };
  }
  function sortItems() {
    items.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      if (a.time !== b.time) return a.time < b.time ? -1 : 1;
      if (a.ts !== b.ts) return a.ts - b.ts;
      return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;

  }

  function dtOf(m) { return m.date + 'T' + m.time; }
  function uses(m) { return m.type === 'a' ? -m.amount : m.amount; }   // cuánto cupo ocupa: compras y cargos suman, abonos restan

  // Cuotas: el total se divide en partes iguales y la última absorbe el redondeo. La cuota 1 se paga en el mes
  // «first» y las demás, una por mes. Las de meses anteriores cuentan como pagadas, la de este mes entra en el

  function cuotaVal(m) { return Math.floor(m.amount / m.n); }
  function cuotaAmt(m, k) { return k === m.n ? m.amount - cuotaVal(m) * (m.n - 1) : cuotaVal(m); }

  // Utilizado = deuda inicial + compras y cargos − abonos, contando desde la fecha de esa deuda.

  // Total a pagar = utilizado − cuotas que vencen después de este mes.
  function compute() {
    var on = !!cfg.at, used = on ? cfg.debt : 0, rows = [], since = 0, q = cuotasInfo();
    var t = { T: 0, A: 0, g: 0, a: 0, nT: 0, nA: 0, ng: 0, na: 0 };
    items.forEach(function (m) {
      var counts = on && dtOf(m) >= cfg.at, run = null;
      if (counts) {
        used += uses(m); run = cfg.limit - used; since++;
        var k = m.type === 'c' ? m.who : m.type;
        t[k] += m.amount; t['n' + k]++;
      }
      rows.push({ m: m, counts: counts, run: run });
    });
    return { used: used, avail: cfg.limit - used, due: Math.max(0, used - q.laterAmt), rows: rows, since: since, t: t, q: q };
  }

  function loadLocal() {
    var list = [];
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) JSON.parse(raw).forEach(function (p) { var n = norm(p); if (n) list.push(n); });
    } catch (e) {}
    items = list; sortItems();
    try { cfg = normCfg(JSON.parse(localStorage.getItem(LS_CFG) || 'null')); } catch (e) { cfg = normCfg(null); }
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(items)); localStorage.setItem(LS_CFG, JSON.stringify(cfg)); } catch (e) {}
  }
  function loadPrefs() {
    try {
      var p = JSON.parse(localStorage.getItem(LS_PREFS) || 'null') || {};
      prefs.order = p.order === 'asc' ? 'asc' : 'desc';
      prefs.token = typeof p.token === 'string' ? p.token.trim().slice(0, 300) : '';
      prefs.repo = prefs.token && REPO_RE.test(String(p.repo || '')) ? String(p.repo) : '';
      if (!prefs.repo) prefs.token = '';
      prefs.last = prefs.repo && +p.last > 0 ? +p.last : 0;
      prefs.note = prefs.repo && p.note && typeof p.note.text === 'string' ? { text: p.note.text.slice(0, 600), at: +p.note.at || 0 } : null;
      prefs.other = prefs.repo && /^\d{4}$/.test(String(p.other || '')) ? String(p.other) : '';
    } catch (e) {}
  }
  function savePrefs() { try { localStorage.setItem(LS_PREFS, JSON.stringify(prefs)); } catch (e) {} }
  // Si FAN ya está conectada en este mismo navegador, su buzón sirve tal cual
  function fanBox() {
    try {
      var p = JSON.parse(localStorage.getItem('fan-preferencias') || 'null');
      if (p && REPO_RE.test(String(p.repo || '')) && typeof p.token === 'string' && p.token.trim().length >= 20) return { repo: String(p.repo), token: p.token.trim() };
    } catch (e) {}
    return null;
  }

  // Descripciones ya usadas en movimientos manuales, para sugerirlas al escribir
  function descOptions(type) {
    var seen = {}, out = [];
    for (var i = items.length - 1; i >= 0 && out.length < 30; i--) {
      var m = items[i];
      if (m.type !== type || (type !== 'c' && m.src !== 'manual')) continue;
      var k = m.desc.toLowerCase();
      if (!seen[k]) { seen[k] = 1; out.push(m.desc); }
    }
    return out;
  }

  async function commit(ups, rems, newCfg) {
    ups = (ups || []).map(norm).filter(Boolean); rems = rems || [];
    var next = items.filter(function (p) { return rems.indexOf(p.id) < 0 && !ups.some(function (u) { return u.id === p.id; }); }).concat(ups);
    if (mode === 'db' && db) {
      try {
        for (var i = 0; i < ups.length; i++) await db.collection(COL).doc(ups[i].id).set(toDoc(ups[i]));
        for (var j = 0; j < rems.length; j++) await db.collection(COL).doc(rems[j]).delete();
        if (newCfg) await db.doc(CFG_PATH).set({ debt: newCfg.debt, at: newCfg.at, limit: newCfg.limit, ignored: newCfg.ignored });
      } catch (e) { toast('No se pudo guardar. Intenta de nuevo.'); return false; }
    }
    items = next; sortItems();
    if (newCfg) cfg = newCfg;
    if (mode !== 'db') saveLocal();
    render();
    return true;
  }

  function toast(msg, actLabel, actFn, ms) {
    toastEl.textContent = '';
    var s = document.createElement('span');
    s.textContent = msg;
    toastEl.appendChild(s);
    if (actLabel) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = actLabel;
      b.addEventListener('click', function () { toastEl.hidden = true; clearTimeout(toast.t); actFn(); });
      toastEl.appendChild(b);
    }
    toastEl.classList.toggle('top', !!sheet);
    toastEl.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { toastEl.hidden = true; }, ms || 3600);
  }

  function copyText(text, okMsg) {
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.left = '0'; ta.style.top = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? okMsg : 'No se pudo copiar en este dispositivo');
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, legacy);
      else legacy();
    } catch (e) { legacy(); }
  }

  /* ---------- Traer compras: buzón de avisos o texto pegado ---------- */
  function pending(parsed, source) {
    var have = {}, ign = {}, ups = [], known = 0, back = [];
    items.forEach(function (m) { if (m.key) have[m.key] = 1; });
    cfg.ignored.forEach(function (k) { ign[k] = 1; });
    parsed.found.forEach(function (p) {
      if (have[p.key]) { known++; return; }
      if (ign[p.key]) {
        if (source === 'box') { known++; return; }     // se eliminó a propósito: el buzón no la devuelve
        back.push(p.key);                               // pegarla a mano sí la recupera
      }
      ups.push({ id: 'm' + hash(p.key), type: 'c', date: p.date, time: p.time, desc: p.merchant, amount: p.amount, src: 'mail', key: p.key, card: p.card, who: p.who, n: p.n, ts: Date.now() });
    });
    return { ups: ups, known: known, back: back };
  }
  function skippedNote(parsed) {
    var parts = [];
    if (parsed.foreign) parts.push(parsed.foreign + ' en dólares');
    if (parsed.other) parts.push(parsed.other + ' de otra tarjeta' + (parsed.otherCard ? ' (··' + parsed.otherCard + ')' : ''));
    return parts.length ? ' Sin contar: ' + parts.join(' y ') + '.' : '';
  }
  // Agrega las compras leídas que falten y cuenta qué pasó, para que cada origen arme su mensaje
  async function addParsed(parsed, source) {
    var res = pending(parsed, source), out = { ok: true, found: parsed.found.length, added: 0, sum: 0, old: 0 };
    if (!res.ups.length) return out;
    var newCfg = res.back.length ? { debt: cfg.debt, at: cfg.at, limit: cfg.limit, ignored: cfg.ignored.filter(function (x) { return res.back.indexOf(x) < 0; }) } : null;
    busy = true;
    out.ok = await commit(res.ups, [], newCfg);
    busy = false;
    if (!out.ok) return out;
    fresh = {};
    res.ups.forEach(function (u) { fresh[u.id] = 1; out.sum += u.amount; if (cfg.at && dtOf(u) < cfg.at) out.old++; });
    out.added = res.ups.length;
    filter = 'all'; shown = PAGE;
    return out;
  }
  function addedMsg(r, parsed) {
    var msg = r.added + ' ' + plural(r.added, 'compra nueva', 'compras nuevas') + ' · ' + money(r.sum) + '.';
    if (r.old) msg += ' ' + r.old + plural(r.old, ' es anterior', ' son anteriores') + ' a la deuda inicial y no ' + plural(r.old, 'cambia', 'cambian') + ' el saldo.';
    return msg + (parsed ? skippedNote(parsed) : '');
  }
  async function importPaste() {
    if (busy) return;
    var parsed = parseMail(val('f-paste'));
    if (!parsed.found.length) { pastePreview(); return; }
    var r = await addParsed(parsed, 'paste');
    if (!r.ok) return;
    closeSheet(); render();
    toast(r.added ? addedMsg(r, parsed) : r.found === 1 ? 'Esa compra ya estaba registrada.' : 'Esas compras ya estaban registradas.', null, null, 5200);
  }

  // Buzón: un repositorio privado de GitHub donde Atajos deja cada correo del banco como un «issue».
  function fetchError(status) { var e = new Error('http'); e.status = status; return e; }
  async function fetchBox(repo, token, since) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 45000);
    var out = [];
    try {
      for (var page = 1; page <= MAX_PAGES; page++) {
        var url = API + repo + '/issues?state=all&sort=created&direction=asc&per_page=100&page=' + page +
          (since ? '&since=' + encodeURIComponent(new Date(since).toISOString().replace(/\.\d+Z$/, 'Z')) : '');
        var res = await fetch(url, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }, cache: 'no-store', signal: ctl ? ctl.signal : undefined });
        if (!res.ok) throw fetchError(res.status);
        var list = await res.json();
        if (!Array.isArray(list)) throw new Error('formato');
        list.forEach(function (it) {
          if (!it || it.pull_request) return;
          var title = String(it.title || '');   // el título solo cuenta si trae el aviso; «Aviso» a secas es la etiqueta del atajo
          out.push({ text: (title.length > 20 ? title + '\n' : '') + String(it.body || ''), at: Date.parse(it.created_at) || 0 });
        });
        if (list.length < 100) break;
      }
      return out;
    } finally { clearTimeout(timer); }
  }
  // Lee cada correo del buzón por separado: junta las compras con tarjeta y recuerda el último que no era una compra
  function parseBox(msgs) {
    var all = { found: [], account: 0, foreign: 0, other: 0, otherCard: '' }, seen = {}, note = null;
    msgs.forEach(function (m) {
      var p = parseMail(m.text);
      p.found.forEach(function (f) { if (!seen[f.key]) { seen[f.key] = 1; all.found.push(f); } });
      all.account += p.account; all.foreign += p.foreign; all.other += p.other;
      if (p.otherCard) all.otherCard = p.otherCard;
      if (!p.found.length && !p.account && !p.foreign && !p.other && (!note || m.at >= note.at)) note = m;
    });
    return { parsed: all, note: note ? { text: plainText(note.text).trim().slice(0, 600), at: note.at } : null };
  }
  function errCode(e) {
    var st = e && e.status;
    return st === 401 ? 'token' : st === 403 ? 'perm' : st === 404 ? 'repo' : st === 410 ? 'issues' : navigator.onLine === false ? 'offline' : 'net';
  }
  function errMsg(code) {
    return {
      token: 'El token de GitHub no es válido o venció. Crea uno nuevo y vuelve a conectar el buzón.',
      perm: 'El token no tiene permiso para leer el buzón. Debe tener «Issues: Read and write» en ese repositorio.',
      repo: 'No encuentro ese repositorio con ese token. Revisa el nombre y que el token tenga acceso a él.',
      issues: 'Ese repositorio tiene los Issues desactivados. Actívalos en Settings → Features.',
      offline: 'Sin conexión: no se pudo leer el buzón.',
      net: 'No se pudo leer el buzón. Intenta de nuevo en un momento.'
    }[code] || 'No se pudo leer el buzón.';
  }
  function ago(ts) {
    var d = new Date(ts), mins = Math.floor((Date.now() - ts) / 60000), hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (mins < 1) return 'hace un momento';
    if (mins < 60) return 'hace ' + mins + ' min';
    var day = dayLabel(dayKey(d));
    return (day === 'Hoy' ? 'hoy' : day === 'Ayer' ? 'ayer' : 'el ' + day) + ' a las ' + hm;
  }
  function keepBoxNotes(box) {
    if (box.note && (!prefs.note || box.note.at >= prefs.note.at)) prefs.note = box.note;
    if (box.parsed.otherCard) prefs.other = box.parsed.otherCard;
  }
  async function syncBox(manual) {
    if (!canSync || !prefs.repo || syncing || busy) return;
    syncing = true; syncErr = ''; lastTry = Date.now();
    render();
    var r = null, box = null, started = Date.now();
    try {
      var msgs = await fetchBox(prefs.repo, prefs.token, prefs.last ? prefs.last - SYNC_MARGIN : 0);
      box = parseBox(msgs);
      r = await addParsed(box.parsed, 'box');
      if (r.ok) { prefs.last = started; keepBoxNotes(box); savePrefs(); }
    } catch (e) { syncErr = errCode(e); }
    syncing = false;
    render();
    if (r && r.ok && r.added) toast(addedMsg(r, manual ? box.parsed : null), null, null, 5200);
    else if (manual && r && r.ok) toast('Al día: no hay compras nuevas con la tarjeta.' + skippedNote(box.parsed), null, null, 4600);
    else if (manual && syncErr) toast(errMsg(syncErr), null, null, 6000);
  }
  function autoSync() {
    if (canSync && prefs.repo && !sheet && !loading && Date.now() - lastTry > SYNC_EVERY) syncBox(false);
    else if (!sheet && !syncing) render();   // refresca «Hoy», «Ayer» y la hora de la última lectura
  }
  function cleanRepo(v) {
    return String(v || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
  }
  async function connectBox() {
    if (syncing || !sheet) return;
    // El token se puede pegar tal como lo copia FAN en «Copiar autorización» (con «Bearer» delante)
    var repo = cleanRepo(val('f-repo')), token = val('f-token').trim().replace(/^Bearer\s+/i, '');
    if (!REPO_RE.test(repo)) { setErr('Escribe el repositorio como usuario/nombre, por ejemplo ' + (OWNER || 'tu-usuario') + '/' + BOX + '.'); return; }
    if (token.length < 20 || /\s/.test(token)) { setErr('Pega el token completo, tal como lo entrega GitHub.'); return; }
    var btn = document.getElementById('f-connect'), msgs, started = Date.now();
    setErr('');
    syncing = true; sheet.testing = true;
    if (btn) { btn.disabled = true; btn.textContent = 'Probando la conexión…'; }
    try {
      msgs = await fetchBox(repo, token, 0);
    } catch (e) {
      syncing = false;
      if (sheet) sheet.testing = false;
      if (btn) { btn.disabled = false; btn.textContent = 'Probar y conectar'; }
      setErr(errMsg(errCode(e)));
      return;
    }
    var box = parseBox(msgs);
    prefs.repo = repo; prefs.token = token; prefs.last = started; prefs.note = null; prefs.other = '';
    keepBoxNotes(box); savePrefs();
    var r = await addParsed(box.parsed, 'box');
    syncing = false; syncErr = ''; lastTry = Date.now();
    openSheet('box');   // ahora muestra el estado del buzón y la automatización de Atajos
    render();
    toast('Buzón conectado. ' + (r.added ? addedMsg(r, box.parsed) : box.parsed.found.length ? 'Sus compras ya estaban registradas.' : 'Aún no tiene avisos de la tarjeta: llegarán con tu próxima compra.'), null, null, 6500);
  }

  /* ---------- Vistas ---------- */
  function header() {
    return '<header class="top"><span class="mark">' + I_CARD + '</span><div><div class="eyebrow">Tarjeta de crédito · registro personal</div><h1>Master</h1></div></header>';
  }

  function hero(c) {
    var h = '<section class="hero" aria-label="Cupo de la tarjeta">' + I_ART + '<div class="hero-top"><span class="eyebrow">Disponible</span>';
    if (!loading && cfg.at) h += '<button class="hero-btn" data-act="setup">Ajustar</button>';
    h += '</div>';
    if (loading) {
      h += '<div class="total word">Cargando…</div><p class="hero-note">Buscando tus movimientos.</p>';
    } else if (!cfg.at) {
      h += '<div class="total word">Sin definir</div>' +
        '<p class="hero-note">Para partir, escribe la deuda pendiente que muestra hoy el banco. Con el cupo de ' + money(cfg.limit) + ', la app calcula el disponible.</p>' +
        '<button class="hero-cta" data-act="setup">Ingresar deuda pendiente</button>';
    } else {
      var txt = money(c.avail);
      var size = txt.length <= 8 ? 'xl' : txt.length <= 10 ? 'lg' : txt.length <= 11 ? 'md' : 'sm';
      var ratio = cfg.limit > 0 ? c.used / cfg.limit : 0, pct = Math.max(0, Math.min(100, ratio * 100));
      var pctTxt = ratio <= 0 ? '0%' : ratio < 0.01 ? 'menos del 1%' : Math.round(ratio * 100) + '%';
      h += '<div class="total ' + size + '">' + txt + '</div>' +
        '<div class="meter' + (pct <= 0 ? ' zero' : '') + (c.avail < 0 ? ' full' : '') + '" role="img" aria-label="Utilizado ' + pctTxt + ' del cupo"><i style="width:' + pct.toFixed(2) + '%"></i></div>';
      if (c.avail < 0) h += '<p class="hero-note warn">Lo utilizado supera el cupo en ' + money(-c.avail) + '. Revisa si falta un abono o ajusta la deuda.</p>';
      else if (c.used < 0) h += '<p class="hero-note warn">Los abonos superan la deuda: hay ' + money(-c.used) + ' a favor. Revisa los montos o ajusta la deuda.</p>';
      else h += '<p class="hero-note">Utilizado ' + pctTxt + ' del cupo de ' + money(cfg.limit) + '</p>';
      h += '<dl class="hero-stats"><div><dt>Utilizado</dt><dd>' + money(c.used) + '</dd></div><div><dt>Total a pagar</dt><dd>' + money(c.due) + '</dd>' +
        (c.q.laterAmt > 0 ? '<small>Sin ' + money(c.q.laterAmt) + ' en cuotas que vencen después</small>' : '') + '</div></dl>';
    }
    return h + '</section>';
  }

  function actions() {
    var main;
    if (!canSync) main = '<button class="btn primary big" data-act="paste">' + I_MAIL + 'Pegar aviso</button>';
    else if (!prefs.repo) main = '<button class="btn primary big" data-act="box">' + I_MAIL + 'Conectar buzón</button>';
    else main = '<button class="btn primary big" data-act="sync"' + (syncing ? ' disabled' : '') + '>' + I_MAIL + (syncing ? 'Leyendo…' : 'Actualizar') + '</button>';
    var h = '<div class="actions">' + main +
      '<button class="btn ghost big" data-act="add" data-t="c">' + I_BAG + 'Compra</button>' +
      '<button class="btn ghost big" data-act="add" data-t="g" aria-label="Anotar un cargo: resta del disponible">' + I_MINUS + 'Cargo</button>' +
      '<button class="btn plus big" data-act="add" data-t="a" aria-label="Anotar un abono: suma al disponible">' + I_PLUS + 'Abono</button></div>';
    if (!canSync) {
      h += '<p class="sync plain">Aquí las compras se agregan pegando el aviso. La lectura automática funciona en la app instalada desde GitHub.</p>';
    } else if (prefs.repo) {
      if (syncing) h += '<div class="sync busy" role="status"><i></i><span>Leyendo el buzón de avisos…</span></div>';
      else if (syncErr) h += '<div class="sync bad" role="status"><i></i><span>' + errMsg(syncErr) + '</span></div>';
      else h += '<div class="sync"><i></i><span>Buzón conectado · ' + (prefs.last ? 'leído ' + ago(prefs.last) : 'aún sin leer') + '</span></div>';
      h += '<div class="under"><button class="linkbtn" data-act="paste">Pegar un aviso</button><button class="linkbtn" data-act="box">Buzón y atajo</button></div>';
    } else {
      h += '<div class="under"><button class="linkbtn" data-act="paste">Pegar un aviso</button></div>';
    }
    return h;
  }

  function startBlock() {
    function step(n, act, done, title, text) {
      return '<li><button class="step' + (done ? ' done' : '') + '" data-act="' + act + '"><span class="step-n">' + (done ? I_CHECK : n) + '</span>' +
        '<span class="step-t"><b>' + title + '</b><span>' + text + '</span></span></button></li>';
    }
    return '<section class="sec" aria-label="Primeros pasos"><div class="sec-head"><h2>Primeros pasos</h2></div><ol class="steps">' +
      step(1, 'setup', !!cfg.at, 'Ingresa la deuda pendiente', 'El cupo utilizado que muestra hoy la app del banco.') +
      (canSync ? step(2, 'box', !!prefs.repo, 'Conecta el buzón de avisos', 'El mismo repositorio privado de GitHub que usa FAN.') +
                 step(3, 'box', false, 'Revisa la automatización de Atajos', 'Si ya la creaste para FAN, es la misma y no hay que hacer nada.')
               : step(2, 'paste', false, 'Pega tu primer aviso', 'Copia el texto del correo del banco y la app extrae los datos.')) +
      '</ol></section>';
  }

  function totalsBlock(c) {
    var t = c.t, sum = t.T + t.A;
    function tile(k) {
      var n = t['n' + k];
      return '<div class="tile ' + k + '"><span class="who"><i></i>' + WHO[k] + '</span><b>' + money(t[k]) + '</b>' +
        '<small>' + (n ? n + ' ' + plural(n, 'compra', 'compras') : 'Sin compras') + (DIG[k] ? ' · ··' + DIG[k] : '') + '</small></div>';
    }
    var h = '<section class="sec" aria-label="Totales por tarjeta"><div class="sec-head"><h2>Por tarjeta</h2><span class="sec-note">Desde el ' + fmt(cfg.at.slice(0, 10)) + '</span></div>';
    if (sum > 0) {
      h += '<div class="split" role="img" aria-label="Titular ' + Math.round(t.T / sum * 100) + '%, Adicional ' + Math.round(t.A / sum * 100) + '% de las compras">' +
        (t.T ? '<i class="T" style="flex:' + t.T + ' 1 0"></i>' : '') + (t.A ? '<i class="A" style="flex:' + t.A + ' 1 0"></i>' : '') + '</div>';
    }
    h += '<div class="tiles">' + tile('T') + tile('A') + '</div>';
    if (t.ng || t.na) {
      h += '<dl class="sums"><div><dt>Cargos</dt><dd>' + money(t.g) + '</dd></div><div><dt>Abonos</dt><dd class="in">' + (t.a ? '+' : '') + money(t.a) + '</dd></div></dl>';
    }
    return h + '<button class="btn tonal block" data-act="extract">' + I_DOC + 'Generar extracto</button></section>';
  }

  function cuotaBar(m, st) {
    var h = '<div class="cq-bar" role="img" aria-label="' + st.paid + ' de ' + m.n + ' cuotas pagadas' + (st.now ? ', la cuota ' + st.now + ' se paga este mes' : '') + '">';
    if (m.n <= 24) { for (var i = 1; i <= m.n; i++) h += '<i' + (i <= st.paid ? ' class="on"' : i === st.now ? ' class="cur"' : '') + '></i>'; }
    else h += (st.paid ? '<i class="on" style="flex:' + st.paid + ' 1 0"></i>' : '') + (st.now ? '<i class="cur" style="flex:1 1 0"></i>' : '') + (st.later ? '<i style="flex:' + st.later + ' 1 0"></i>' : '');
    return h + '</div>';
  }
  function cuotaCard(m) {
    var st = cuotaState(m), done = st.paid >= m.n;
    return '<li class="cq' + (done ? ' done' : '') + '">' +
      '<button class="cq-head" data-act="edit" data-id="' + m.id + '" aria-label="Editar compra en cuotas: ' + esc(m.desc) + '">' +

  function rowHtml(r) {
    var m = r.m, isIn = m.type === 'a';
    var icon = isIn ? I_IN : m.type === 'g' ? I_OUT : I_BAG;
    var what = isIn ? 'Abono' : m.type === 'g' ? 'Cargo' : 'Compra';
    var amt = (isIn ? '+' : '−') + '$' + dots(m.amount);
    var meta = dayLabel(m.date) + ' · ' + m.time + (m.n > 1 ? ' · ' + m.n + ' cuotas' : '');
    var tag = m.type === 'c' ? '<span class="pill ' + m.who + '">' + WHO[m.who] + '</span>' : '<span class="kind">' + what + '</span>';
    return '<li><button class="row' + (r.counts || !cfg.at ? '' : ' old') + '" data-act="edit" data-id="' + m.id + '" aria-label="Editar ' + what.toLowerCase() + ': ' + esc(m.desc) + ', ' + amt + ', ' + fmt(m.date) + (m.who ? ', ' + WHO[m.who] : '') + '">' +
      '<span class="ico' + (isIn ? ' in' : '') + '">' + icon + '</span>' +
      '<span class="info"><span class="store">' + esc(m.desc) + (fresh[m.id] ? '<span class="pill new">Nueva</span>' : '') + '</span><span class="meta">' + meta + '</span></span>' +
      '<span class="nums"><span class="amt' + (isIn ? ' in' : '') + '">' + amt + '</span>' + tag + '</span></button></li>';
  }

  function matches(m) { return filter === 'all' || (filter === 'o' ? m.type !== 'c' : m.type === 'c' && m.who === filter); }
  function listBlock(c) {
    var has = { T: 0, A: 0, o: 0 };
    items.forEach(function (m) { has[m.type === 'c' ? m.who : 'o']++; });
    var kinds = (has.T ? 1 : 0) + (has.A ? 1 : 0) + (has.o ? 1 : 0);

    var h = '<section class="sec" aria-label="Movimientos"><div class="sec-head"><h2>Movimientos</h2>';
    if (items.length > 1) h += '<button class="btn ghost small" data-act="order" aria-label="Cambiar el orden del listado">' + I_SORT + (prefs.order === 'desc' ? 'Recientes primero' : 'Antiguos primero') + '</button>';
    h += '</div>';
    if (kinds < 2 || (filter !== 'all' && !has[filter])) filter = 'all';
    if (kinds > 1) {
      h += '<div class="chips" role="group" aria-label="Filtrar movimientos">' +
        [['all', 'Todos', 1], ['T', 'Titular', has.T], ['A', 'Adicional', has.A], ['o', 'Cargos y abonos', has.o]].map(function (f) {
          return f[2] ? '<button class="chip" data-act="filter" data-f="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>' : '';
        }).join('') + '</div>';
    }

    // Lista en orden cronológico, con la marca de la deuda inicial en su lugar
    var seq = [], placed = !cfg.at;
    c.rows.forEach(function (r) {
      if (!placed && r.counts) { seq.push(null); placed = true; }
      if (matches(r.m)) seq.push(r);
    });
    if (!placed) seq.push(null);
    if (prefs.order === 'desc') seq.reverse();
    var total = seq.length, cut = seq.slice(0, shown);
    h += '<ul class="list">';
    cut.forEach(function (r) {
      h += r ? rowHtml(r) : '<li class="anchor"><span>Deuda inicial ' + money(cfg.debt) + ' · ' + fmtAt(cfg.at) + '</span></li>';
    });
    h += '</ul>';
    if (total > shown) h += '<button class="btn ghost block" data-act="more">Ver más movimientos (' + (total - shown) + ')</button>';
    return h + '</section>';
  }

  function dataBlock() {
    var where = mode === 'db' ? 'Los movimientos se guardan en este artefacto de Claude.' : 'Los movimientos se guardan solo en este dispositivo.';
    return '<details class="backup" id="d-backup"><summary>Datos y respaldo</summary>' +
      '<p class="muted">' + where + ' Copia un respaldo para guardarlo en Notas o llevarlo a otro equipo.</p>' +
      '<textarea id="bk-text" rows="4" spellcheck="false" aria-label="Texto del respaldo"></textarea>' +

      '<button class="btn danger block" data-act="wipe"' + (items.length || cfg.at ? '' : ' disabled') + '>Borrar todos los datos</button></details>';
  }

  function render() {
    var c = compute();
    var h = header() + hero(c);
    if (!loading) {
      h += actions();
      if (items.length) h += (cfg.at ? totalsBlock(c) : '') + cuotasBlock() + listBlock(c);
      else h += startBlock();
      h += dataBlock();
    }
    h += '<p class="foot">Registro personal. No es la app oficial del banco ni está conectada a tu tarjeta.</p>';
    var open = {}, bk = document.getElementById('bk-text'), bkVal = bk ? bk.value : '';
    Array.prototype.forEach.call(app.querySelectorAll('details[id]'), function (d) { if (d.open) open[d.id] = 1; });
    app.innerHTML = h;
    restoreArmed = false; wipeArmed = false;
    Object.keys(open).forEach(function (id) { var d = document.getElementById(id); if (d) d.open = true; });
    if (open['d-backup'] && bkVal) { var nb = document.getElementById('bk-text'); if (nb) nb.value = bkVal; }
  }

  // Muestra el valor de cada cuota y los meses en que se pagan; el mes de la cuota 1 solo se pide si hay cuotas
  function cuotaPreview() {
    var out = document.getElementById('f-cuota'), wrap = document.getElementById('f-first-wrap'), lab = document.getElementById('f-first');
    if (!out || !wrap || !sheet) return;
    var n = +val('f-n'), amount = +digits('f-amount'), ok = n >= 2 && n <= MAX_N;
    wrap.hidden = !ok;
    if (lab) lab.textContent = monthName(sheet.first);
    if (!ok) { out.textContent = 'Sin cuotas: se paga de una vez. Sube el número si fue en cuotas.'; return; }
    var end = addMonths(sheet.first, n - 1);
    out.textContent = (amount > 0 ? n + ' cuotas de ' + money(Math.floor(amount / n)) : n + ' cuotas') + ', ' +
      (n === 2 ? 'en ' + monthName(sheet.first) + ' y ' + monthName(end) : 'de ' + monthName(sheet.first) + ' a ' + monthName(end)) +
      '. El total ocupa el cupo desde la compra; al total a pagar entra la cuota de cada mes.';
  }

      '<details class="fold"><summary>Todavía no tengo un buzón</summary><ol class="guide">' +
      '<li><div>En GitHub, crea un repositorio <strong>privado</strong> llamado <span class="mono">' + BOX + '</span>.</div></li>' +
      '<li><div>Crea un token en <strong>Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token</strong>.</div></li>' +
      '<li><div>En <strong>Repository access</strong> elige <strong>Only select repositories</strong> y marca <span class="mono">' + BOX + '</span>. En <strong>Permissions</strong>, da a <strong>Issues</strong> el acceso <strong>Read and write</strong>.</div></li>' +
      '<li><div>Toca <strong>Generate token</strong>, copia el token y pégalo aquí.</div></li>' +
      '</ol></details>' +
      '<p class="note">El token queda guardado solo en este dispositivo y no entra en los respaldos. Sirve únicamente para los Issues de ese repositorio.</p>' +
      '<p class="err" id="f-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="submit" class="btn primary block" id="f-connect">Probar y conectar</button>' +
      '<button type="button" class="btn ghost block" data-act="cancel">Cancelar</button></div></form>';
  }

  /* ---------- Extracto ---------- */
  // Todos los movimientos desde la deuda inicial, con el total a pagar. Aquí los montos van como deuda:
  // compras y cargos en positivo, abonos en negativo. El total a pagar deja fuera las cuotas que vencen después.
  function buildExtract() {
    var c = compute(), t = c.t, q = c.q, now = todayKey(), mes = monthName(thisMonth());
    var rows = c.rows.filter(function (r) { return r.counts; });
    function kind(m) { return m.type === 'c' ? WHO[m.who] + (m.n > 1 ? ' · ' + m.n + ' cuotas' : '') : m.type === 'g' ? 'Cargo' : 'Abono'; }
    function owed(m) { return money(uses(m)); }
    function cuotaLine(m) {
      var st = cuotaState(m);
      return m.n + ' cuotas de ' + money(cuotaVal(m)) + ' · este mes: ' + (st.now ? 'cuota ' + st.now + ', ' + money(st.nowAmt) : 'ninguna') +
        ' · después: ' + (st.later ? st.later + ' ' + plural(st.later, 'cuota', 'cuotas') + ', ' + money(st.laterAmt) + ', hasta ' + monthName(st.end) : 'ninguna');
    }

    var L = ['MASTER · Extracto de la tarjeta', 'Generado el ' + fmtFull(now) + ', ' + nowTime(), '',
      'Cupo: ' + money(cfg.limit), 'Utilizado: ' + money(c.used), 'Disponible: ' + money(c.avail), '',
      'DEUDA INICIAL', fmtNum(cfg.at.slice(0, 10)) + ' ' + cfg.at.slice(11) + ' · ' + money(cfg.debt), '',
      'MOVIMIENTOS (' + rows.length + ')'];
    if (!rows.length) L.push('Sin movimientos desde la deuda inicial.');
    rows.forEach(function (r, i) { var m = r.m; L.push((i + 1) + '. ' + fmtNum(m.date) + ' ' + m.time + ' · ' + m.desc + ' · ' + kind(m) + ' · ' + owed(m)); });
    L.push('', 'TOTALES',
      'Deuda inicial: ' + money(cfg.debt),
      'Titular (' + t.nT + ' ' + plural(t.nT, 'compra', 'compras') + '): ' + money(t.T),
      'Adicional (' + t.nA + ' ' + plural(t.nA, 'compra', 'compras') + '): ' + money(t.A),
      'Cargos (' + t.ng + '): ' + money(t.g),
      'Abonos (' + t.na + '): ' + money(-t.a),
      'Utilizado: ' + money(c.used));
    if (q.laterAmt > 0) L.push('Cuotas que vencen después de ' + mes + ' (' + q.laterN + '): ' + money(-q.laterAmt));
    L.push('', 'TOTAL A PAGAR: ' + money(c.due));
    if (q.active.length) {
      L.push('', 'COMPRAS EN CUOTAS');
      q.active.forEach(function (m) { L.push(m.desc + ' · ' + WHO[m.who] + ' · ' + cuotaLine(m)); });
      L.push('Cuotas de este mes, dentro del total a pagar: ' + money(q.nowAmt));
    }

    var h = '<dl class="ext-kv"><div><dt>Cupo</dt><dd>' + money(cfg.limit) + '</dd></div><div><dt>Utilizado</dt><dd>' + money(c.used) + '</dd></div><div><dt>Disponible</dt><dd>' + money(c.avail) + '</dd></div></dl>' +
      '<h3>Movimientos (' + rows.length + ')</h3><ul class="ext-list">' +
      '<li><b>Deuda inicial</b><i>' + money(cfg.debt) + '</i><span>' + fmtFull(cfg.at.slice(0, 10)) + ', ' + cfg.at.slice(11) + '</span></li>' +
      rows.map(function (r) { var m = r.m; return '<li><b>' + esc(m.desc) + '</b><i' + (m.type === 'a' ? ' class="in"' : '') + '>' + owed(m) + '</i><span>' + fmtFull(m.date) + ', ' + m.time + ' · ' + kind(m) + '</span></li>'; }).join('') + '</ul>' +
      '<h3>Totales</h3><dl class="ext-kv">' +
      '<div><dt>Deuda inicial</dt><dd>' + money(cfg.debt) + '</dd></div>' +
      '<div><dt>Titular · ' + t.nT + ' ' + plural(t.nT, 'compra', 'compras') + '</dt><dd>' + money(t.T) + '</dd></div>' +
      '<div><dt>Adicional · ' + t.nA + ' ' + plural(t.nA, 'compra', 'compras') + '</dt><dd>' + money(t.A) + '</dd></div>' +
      '<div><dt>Cargos · ' + t.ng + '</dt><dd>' + money(t.g) + '</dd></div>' +
      '<div><dt>Abonos · ' + t.na + '</dt><dd class="in">' + money(-t.a) + '</dd></div>' +
      '<div class="sum"><dt>Utilizado</dt><dd>' + money(c.used) + '</dd></div>' +
      (q.laterAmt > 0 ? '<div><dt>Cuotas que vencen después · ' + q.laterN + '</dt><dd>' + money(-q.laterAmt) + '</dd></div>' : '') + '</dl>' +
      '<div class="ext-total"><span>Total a pagar</span><b>' + money(c.due) + '</b></div>';
    if (q.active.length) {
      h += '<h3>Compras en cuotas</h3><ul class="ext-list">' +
        q.active.map(function (m) { return '<li><b>' + esc(m.desc) + '</b><i>' + money(m.amount) + '</i><span>' + WHO[m.who] + ' · ' + cuotaLine(m) + '</span></li>'; }).join('') + '</ul>' +
        '<p class="note">El total a pagar incluye <strong>' + money(q.nowAmt) + '</strong> en cuotas de ' + mes + '.' +
        (q.laterAmt > 0 ? ' Quedan fuera <strong>' + money(q.laterAmt) + '</strong> en cuotas que vencen después: ocupan cupo, pero se pagan en sus meses.' : '') + '</p>';
    }
    return { html: h, text: L.join('\n') };
  }
  function sheetExtract(s) {
    var ex = buildExtract();
    s.text = ex.text;
    var canShare = !hasHost && typeof navigator.share === 'function';
    return '<div class="panel" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' +
      '<h2 id="sheet-title">Extracto</h2>' +
      '<p class="sub">Todos los movimientos desde la deuda inicial del ' + fmtFull(cfg.at.slice(0, 10)) + '. Generado el ' + fmtFull(todayKey()) + ', ' + nowTime() + '.</p>' +
      ex.html +
      '<div class="stack"><button type="button" class="btn primary block" data-act="ext-copy">Copiar extracto</button>' +
      (canShare ? '<button type="button" class="btn tonal block" data-act="ext-share">Compartir</button>' : '') +
      '<button type="button" class="btn ghost block" data-act="cancel">Cerrar</button></div></div>';
  }

  function renderSheet() {
    var s = sheet, h = '<div class="backdrop" data-act="cancel"></div>';
    if (s.mode === 'setup') h += sheetSetup();
    else if (s.mode === 'paste') h += sheetPaste();
    else if (s.mode === 'box') h += sheetBox();
    else if (s.mode === 'extract') h += sheetExtract(s);
    else h += sheetMove(s);
    sheetEl.innerHTML = h;
    cuotaPreview();
  }

  // Mantiene la hoja dentro del área visible cuando aparece el teclado del teléfono
  function fitSheet() {
    var vv = window.visualViewport;
    if (!vv || sheetEl.hidden) return;
    sheetEl.style.top = vv.offsetTop + 'px';
    sheetEl.style.bottom = 'auto';
    sheetEl.style.height = vv.height + 'px';
  }
  function openSheet(m, id, opts) {
    var p = m === 'edit' ? find(id) : null;
    if (m === 'edit' && !p) return;
    if (m === 'extract' && !cfg.at) return;
    opts = opts || {};
    sheet = { mode: m, id: id || null, del: false, testing: false, text: '',
      type: p ? p.type : opts.type || 'c', who: p && p.who ? p.who : 'T', n: opts.n || 1,
      // Mes de la cuota 1: el guardado o, mientras no se toque, el mes siguiente a la fecha de la compra
      first: p && p.first ? p.first : addMonths((p ? p.date : todayKey()).slice(0, 7), 1), firstAuto: !(p && p.first) };
    renderSheet();
    sheetEl.hidden = false;
    document.documentElement.classList.add('lock');
    toastEl.hidden = true;
    fitSheet();
    var target = document.getElementById(m === 'add' ? 'f-amount' : m === 'setup' ? 'f-debt' : m === 'paste' ? 'f-paste' : 'sheet-form');
    if (target) target.focus();
  }
  function closeSheet() {
    sheet = null; sheetEl.hidden = true; sheetEl.innerHTML = '';
    sheetEl.style.top = ''; sheetEl.style.bottom = ''; sheetEl.style.height = '';
    document.documentElement.classList.remove('lock');
  }
  function setErr(msg) {
    var e = document.getElementById('f-err');
    if (!e) return;
    e.textContent = msg; e.hidden = !msg;
    if (msg && e.scrollIntoView) e.scrollIntoView({ block: 'nearest' });
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function digits(id) { return val(id).replace(/[.\s$]/g, ''); }

  async function saveMove() {
    var today = todayKey();
    var p = sheet.id ? find(sheet.id) : null;
    if (sheet.mode === 'edit' && !p) { closeSheet(); return; }
    var type = sheet.type, k = KIND[type];
    var raw = digits('f-amount'), desc = clean(val('f-desc')), date = val('f-date'), time = val('f-time');
    if (!/^\d+$/.test(raw) || +raw <= 0) { setErr('Escribe el monto en pesos, por ejemplo 150000.'); return; }
    if (+raw > MAX_AMOUNT) { setErr('El monto es demasiado grande. Revisa los dígitos.'); return; }
    if (!validDate(date)) { setErr('Indica la fecha del movimiento.'); return; }
    if (date > today) { setErr('La fecha no puede ser futura.'); return; }
    if (!TIME_RE.test(time)) { setErr('Indica la hora, por ejemplo 13:04.'); return; }
    if (!desc && p && p.src === 'mail') { setErr('Escribe el nombre del comercio.'); return; }
    var n = 1;
    if (type === 'c') {
      var rn = val('f-n').trim();
      if (!/^\d+$/.test(rn) || +rn < 1 || +rn > MAX_N) { setErr('Indica el número de cuotas, entre 1 y ' + MAX_N + '. Usa 1 si fue sin cuotas.'); return; }
      n = +rn;
      if (n > 1 && sheet.first < date.slice(0, 7)) { setErr('La cuota 1 no puede pagarse antes del mes de la compra.'); return; }
    }
    var rec = { id: p ? p.id : genId(), type: type, date: date, time: time, desc: desc, amount: +raw, src: p ? p.src : 'manual', key: p ? p.key : '',
      card: p ? p.card : '', who: type === 'c' ? sheet.who : '', n: n, first: n > 1 ? sheet.first : '', ts: p ? p.ts : Date.now() };
    var ups = [rec];
    busy = true;
    var ok = await commit(ups, []);
    busy = false;
    if (!ok) return;
    closeSheet();
    if (p) toast('Cambios guardados');
    else if (type === 'a') toast('Abono anotado · +$' + dots(rec.amount));
    else toast((type === 'g' ? 'Cargo anotado · −$' : n > 1 ? 'Compra en ' + n + ' cuotas anotada · −$' : 'Compra anotada · −$') + dots(rec.amount));
  }

  async function saveSetup() {
    var d = digits('f-debt'), l = digits('f-limit'), date = val('f-date'), time = val('f-time');
    if (!/^\d+$/.test(d)) { setErr('Escribe la deuda pendiente en pesos, por ejemplo 850000. Si no debes nada, escribe 0.'); return; }
    if (!/^\d+$/.test(l) || +l <= 0) { setErr('Escribe el cupo de la tarjeta, por ejemplo 5000000.'); return; }
    if (+d > MAX_AMOUNT || +l > MAX_AMOUNT) { setErr('El monto es demasiado grande. Revisa los dígitos.'); return; }
    if (!validDate(date) || !TIME_RE.test(time)) { setErr('Indica la fecha y la hora de esa deuda.'); return; }
    if (date + 'T' + time > todayKey() + 'T' + nowTime()) { setErr('La fecha de la deuda no puede ser futura.'); return; }
    var prev = cfg, first = !cfg.at;
    var next = { debt: +d, at: date + 'T' + time, limit: +l, ignored: cfg.ignored };
    busy = true;
    var ok = await commit([], [], next);
    busy = false;
    if (!ok) return;
    closeSheet();
    toast((first ? 'Deuda inicial: ' : 'Deuda ajustada a ') + money(next.debt) + ' · disponible ' + money(next.limit - next.debt), 'Deshacer', function () { commit([], [], prev); }, 6000);
  }

  function pastePreview() {
    var out = document.getElementById('f-found'), btn = document.getElementById('f-paste-add');
    if (!out || !btn) return;
    setErr('');
    var text = val('f-paste');
    var parsed = parseMail(text), res = pending(parsed, 'paste'), isNew = {};
    res.ups.forEach(function (u) { isNew[u.key] = 1; });
    out.innerHTML = parsed.found.map(function (p) {
      return '<li><b>' + esc(p.merchant) + '</b><i>' + money(p.amount) + '</i><span>' + fmt(p.date) + ', ' + p.time + ' · ' + WHO[p.who] + (p.n > 1 ? ' · ' + p.n + ' cuotas' : '') + (isNew[p.key] ? '' : ' · Ya registrada') + '</span></li>';
    }).join('');
    out.hidden = !parsed.found.length;
    var k = res.ups.length;
    btn.disabled = !k;
    btn.textContent = k > 1 ? 'Agregar ' + k + ' compras' : 'Agregar compra';
    if (!parsed.found.length && text.trim().length > 30) {
      setErr(parsed.other ? 'Ese aviso es de otra tarjeta' + (parsed.otherCard ? ' (··' + parsed.otherCard + ')' : '') + '. Aquí se registran ' + Object.keys(CARDS).map(function (d) { return '··' + d; }).join(' y ') + '.'
        : parsed.foreign ? 'Ese aviso es de una compra en dólares, que no usa el cupo en pesos.'
        : parsed.account ? 'Ese aviso es de una compra con cargo a la cuenta, no con la tarjeta de crédito.'
        : 'No reconozco un aviso de compra en ese texto. Revisa que esté completo, con el monto, la tarjeta, el comercio y la fecha.');
    }
  }

  sheetEl.addEventListener('click', async function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || !sheet) return;
    var a = b.getAttribute('data-act');
    if (a === 'cancel') { if (!busy && !sheet.testing) closeSheet(); return; }
    if (a === 'copy-sender') { copyText(SENDER, 'Remitente copiado'); return; }
    if (a === 'copy-url') { copyText(API + prefs.repo + '/issues', 'Dirección copiada'); return; }
    if (a === 'copy-auth') { copyText('Bearer ' + prefs.token, 'Autorización copiada'); return; }
    if (a === 'copy-note') { copyText(prefs.note ? prefs.note.text : '', 'Texto copiado'); return; }
    if (a === 'ext-copy') { copyText(sheet.text, 'Extracto copiado'); return; }
    if (a === 'ext-share') {
      try { navigator.share({ title: 'Extracto Master', text: sheet.text }).catch(function () {}); } catch (e) { copyText(sheet.text, 'Extracto copiado'); }
      return;
    }
    if (a === 'paste-add') { importPaste(); return; }
    if (a === 'sync-now') { closeSheet(); syncBox(true); return; }
    if (a === 'disconnect') {
      if (!sheet.del) { sheet.del = true; b.textContent = 'Toca de nuevo para desconectar'; b.classList.add('armed'); return; }
      prefs.repo = ''; prefs.token = ''; prefs.last = 0; prefs.note = null; prefs.other = ''; syncErr = ''; savePrefs();
      closeSheet(); render();
      toast('Buzón desconectado. Tus movimientos siguen aquí.');
      return;
    }
    if (a === 'type') {
      var t = b.getAttribute('data-t'), k = KIND[t];
      if (!k || sheet.id) return;
      sheet.type = t;
      Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-act="type"]'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-t') === t)); });
      var d = document.getElementById('f-desc'), dl = document.getElementById('f-descs');
      document.getElementById('f-hint').textContent = k.hint;
      document.getElementById('f-amount-label').textContent = t === 'c' ? 'Monto total' : 'Monto';
      document.getElementById('f-desc-label').textContent = k.label;
      document.getElementById('f-save').textContent = k.save;
      document.getElementById('f-buy').hidden = t !== 'c';
      if (d) d.placeholder = k.ph;
      if (dl) dl.innerHTML = descOptions(t).map(function (x) { return '<option value="' + esc(x) + '"></option>'; }).join('');
      return;
    }
    if (a === 'who') {
      sheet.who = b.getAttribute('data-w') === 'A' ? 'A' : 'T';
      Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-act="who"]'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-w') === sheet.who)); });
      return;
    }
    if (a === 'step') {
      var inp = document.getElementById(b.getAttribute('data-for'));
      if (!inp) return;
      inp.value = Math.max(1, Math.min(MAX_N, (parseInt(inp.value, 10) || 0) + (+b.getAttribute('data-d'))));
      cuotaPreview();
      return;
    }
    if (a === 'month') {
      sheet.first = addMonths(sheet.first, +b.getAttribute('data-d') < 0 ? -1 : 1);
      sheet.firstAuto = false;
      cuotaPreview();
      return;
    }
    if (a === 'delete') {
      var p = sheet.id ? find(sheet.id) : null;
      if (!p) { closeSheet(); return; }
      if (!sheet.del) { sheet.del = true; b.textContent = 'Toca de nuevo para eliminar'; b.classList.add('armed'); return; }
      if (busy) return;
      var prev = cfg, next = null, snap = copyOf(p);
      if (p.key) next = { debt: cfg.debt, at: cfg.at, limit: cfg.limit, ignored: cfg.ignored.filter(function (x) { return x !== p.key; }).concat(p.key).slice(-MAX_IGNORED) };
      busy = true;
      var ok = await commit([], [p.id], next);
      busy = false;
      if (ok) { closeSheet(); toast('Movimiento eliminado', 'Deshacer', function () { commit([snap], [], next ? prev : null); }, 6000); }
    }
  });

  sheetEl.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!sheet || busy) return;
    if (sheet.mode === 'setup') saveSetup();
    else if (sheet.mode === 'box') connectBox();
    else if (sheet.mode === 'add' || sheet.mode === 'edit') saveMove();
  });

  sheetEl.addEventListener('input', function (ev) {
    var t = ev.target;
    if (!t) return;
    if (t.id === 'f-amount' || t.id === 'f-debt' || t.id === 'f-limit') {
      // El monto se muestra con separador de miles mientras se escribe
      var d = t.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 10);
      if (t.id !== 'f-debt') d = d.replace(/^0+/, '');
      t.value = d ? dots(+d) : '';
      if (t.id === 'f-amount') cuotaPreview(); else setupPreview();
    } else if (t.id === 'f-n') {
      t.value = t.value.replace(/\D/g, '').slice(0, 2);
      cuotaPreview();
    } else if (t.id === 'f-paste') {
      pastePreview();
    } else if (t.id === 'f-date' || t.id === 'f-time') {
      var n = document.getElementById('f-note'), msg = sheet && sheet.mode !== 'setup' ? anchorNote(val('f-date'), val('f-time')) : '';
      if (n) { n.textContent = msg; n.hidden = !msg; }
      if (t.id === 'f-date' && sheet && sheet.firstAuto && validDate(t.value)) { sheet.first = addMonths(t.value.slice(0, 7), 1); cuotaPreview(); }
    }
  });

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && sheet && !busy && !sheet.testing) closeSheet(); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitSheet);
    window.visualViewport.addEventListener('scroll', fitSheet);
  }

  /* ---------- Acciones de la página ---------- */
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'add') openSheet('add', null, { type: KIND[b.getAttribute('data-t')] ? b.getAttribute('data-t') : 'c' });
    else if (a === 'add-cuotas') openSheet('add', null, { type: 'c', n: 3 });
    else if (a === 'edit') openSheet('edit', b.getAttribute('data-id'));
    else if (a === 'setup') openSheet('setup');
    else if (a === 'paste') openSheet('paste');
    else if (a === 'box') openSheet('box');
    else if (a === 'extract') openSheet('extract');
    else if (a === 'sync') syncBox(true);
    else if (a === 'order') { prefs.order = prefs.order === 'desc' ? 'asc' : 'desc'; savePrefs(); render(); }
    else if (a === 'filter') { filter = b.getAttribute('data-f'); shown = PAGE; render(); }
    else if (a === 'more') { shown += PAGE; render(); }
    else if (a === 'bk-copy') backupCopy();
    else if (a === 'bk-restore') backupRestore(b);
    else if (a === 'wipe') wipe(b);
  });

  function backupCopy() {
    var ta = document.getElementById('bk-text');
    var json = JSON.stringify({ app: 'master', v: 1, tarjeta: cfg, movimientos: items.map(function (m) { return copyOf(m); }) });
    ta.value = json;
    function manual() { ta.focus(); ta.select(); toast('Selecciona el texto y cópialo'); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(function () { toast('Respaldo copiado'); }, manual);
      else manual();
    } catch (e) { manual(); }
  }

  async function backupRestore(btn) {
    var ta = document.getElementById('bk-text');
    var list = [], nextCfg;
    try {
      var data = JSON.parse(ta.value);
      if (!data || !Array.isArray(data.movimientos)) throw new Error('formato');
      data.movimientos.forEach(function (p) { var n = norm(p); if (n) list.push(n); });
      nextCfg = normCfg(data.tarjeta);
    } catch (e) { toast('El texto no es un respaldo válido'); return; }
    if (!list.length && !nextCfg.at) { toast('El respaldo no tiene movimientos'); return; }
    if ((items.length || cfg.at) && !restoreArmed) {
      restoreArmed = true; btn.textContent = 'Toca de nuevo para reemplazar';
      toast('Esto reemplaza los datos actuales');
      return;
    }
    if (busy) return;
    var keep = {};
    list.forEach(function (m) { keep[m.id] = 1; });
    busy = true;
    var ok = await commit(list, items.filter(function (m) { return !keep[m.id]; }).map(function (m) { return m.id; }), nextCfg);
    busy = false;
    if (ok) toast('Respaldo restaurado');
  }

  async function wipe(btn) {
    if (!wipeArmed) { wipeArmed = true; btn.textContent = 'Toca de nuevo para borrar todo'; btn.classList.add('armed'); return; }
    if (busy) return;
    var snap = items.map(function (m) { return copyOf(m); }), prev = cfg;
    busy = true;
    var ok = await commit([], snap.map(function (m) { return m.id; }), { debt: 0, at: '', limit: cfg.limit, ignored: [] });
    busy = false;
    if (ok) toast('Datos borrados', 'Deshacer', function () { commit(snap, [], prev); }, 9000);
  }

  /* ---------- Arranque ---------- */
  function fallback() { mode = 'local'; db = null; loading = false; loadLocal(); render(); }

  async function connect() {
    try {
      if (!hasHost) return;
      db = await window.claude.use('db');
      if (!db) { fallback(); return; }
      mode = 'db';
      var ready = function () { if (gotItems && gotCfg) loading = false; render(); };
      db.collection(COL).onSnapshot(function (snap) {
        var list = [];
        snap.docs.forEach(function (doc) {
          var n = norm(Object.assign({}, doc.data() || {}, { id: doc.id }));
          if (n) list.push(n);
        });
        items = list; sortItems(); gotItems = true; ready();
      }, function () { fallback(); });
      db.doc(CFG_PATH).onSnapshot(function (snap) {
        cfg = normCfg(snap.exists ? snap.data() : null); gotCfg = true; ready();
      }, function () { fallback(); });
    } catch (e) { fallback(); }
  }

  loadPrefs();
  if (!loading) loadLocal();
  render();
  connect();
  if (canSync && prefs.repo) syncBox(false);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') autoSync(); });
  window.addEventListener('online', function () { if (syncErr) autoSync(); });

  if (!hasHost && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>

</body>

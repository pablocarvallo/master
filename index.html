<style>
/* Concepto: la tarjeta sobre la mesa. Arriba el cupo, en una tarjeta grafito con el medidor de lo utilizado en brasa;
   debajo las acciones (leer el buzón de avisos, anotar compra, cargo o abono), los totales por tarjeta, las compras
   en cuotas y el listado de movimientos. Grafito para las acciones, naranja para Titular, azul para Adicional,
   verde solo para lo que vuelve al cupo. */
/*DS:TOKENS:START*/
/* ── Domésticas · sistema de diseño común (v1) ──────────────────────────────
   Paleta: #2950F4 · #4D78F3 · #719DF6 · #99C2F8 · #BDEBFB, con el azul marino #182D4A de fondo oscuro.
   Estilo iOS 27: tipografía del sistema (SF Pro), tarjetas blancas sobre fondo agrupado,
   barras y botones de vidrio, cápsulas, esquinas amplias. Igual en todas las apps de la casa. */
:root {
  --ds-b1: #2950F4; --ds-b2: #4D78F3; --ds-b3: #719DF6; --ds-b4: #99C2F8; --ds-b5: #BDEBFB; --ds-navy: #182D4A;
  --ds-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --ds-font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --ds-font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ds-font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ds-r-card: 24px; --ds-r-inner: 16px; --ds-r-field: 14px; --ds-r-sheet: 34px; --ds-r-pill: 999px;

  --ds-bg: #EFF3FB;
  --ds-bg-top: #DFE9FD;
  --ds-surface: #FFFFFF;
  --ds-surface-2: #F3F6FD;
  --ds-fill: rgba(41, 80, 244, 0.07);
  --ds-fill-2: rgba(41, 80, 244, 0.13);
  --ds-ink: #0E1B33;
  --ds-ink-2: #55617A;
  --ds-ink-3: #8691A8;
  --ds-line: rgba(24, 45, 74, 0.12);
  --ds-line-2: rgba(24, 45, 74, 0.2);
  --ds-tint: #2950F4;
  --ds-tint-soft: #E5ECFE;
  --ds-btn: #2950F4;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #157A43; --ds-pos-soft: #DDF4E6;
  --ds-neg: #D1281C; --ds-neg-soft: #FDE8E6;
  --ds-warn: #A35500; --ds-warn-soft: #FFF0D9;
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.45) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #4D78F3 0%, #2950F4 58%, #2141D6 100%);
  --ds-hero-ink: #FFFFFF;
  --ds-hero-ink-2: rgba(255, 255, 255, 0.84);
  --ds-hero-line: rgba(255, 255, 255, 0.28);
  --ds-hero-glass: rgba(255, 255, 255, 0.18);
  --ds-glass: rgba(255, 255, 255, 0.7);
  --ds-glass-strong: rgba(255, 255, 255, 0.86);
  --ds-glass-line: rgba(255, 255, 255, 0.85);
  --ds-glass-edge: rgba(14, 27, 51, 0.1);
  --ds-glass-blur: blur(22px) saturate(1.8);
  --ds-shadow-1: 0 1px 2px rgba(24, 45, 74, 0.05), 0 4px 14px rgba(24, 45, 74, 0.05);
  --ds-shadow-2: 0 12px 32px rgba(24, 45, 74, 0.16), 0 2px 8px rgba(24, 45, 74, 0.08);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 6px 16px rgba(41, 80, 244, 0.26);
  --ds-scrim: rgba(14, 27, 51, 0.36);
  --ds-chart-1: #2950F4; --ds-chart-2: #719DF6; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ds-bg: #0A1224;
    --ds-bg-top: #13244A;
    --ds-surface: #152340;
    --ds-surface-2: #1C2C4D;
    --ds-fill: rgba(113, 157, 246, 0.12);
    --ds-fill-2: rgba(113, 157, 246, 0.2);
    --ds-ink: #EEF3FF;
    --ds-ink-2: #A9B6D0;
    --ds-ink-3: #77859F;
    --ds-line: rgba(189, 235, 251, 0.11);
    --ds-line-2: rgba(189, 235, 251, 0.2);
    --ds-tint: #8EB0FA;
    --ds-tint-soft: rgba(113, 157, 246, 0.18);
    --ds-btn: #3A62F5;
    --ds-on-btn: #FFFFFF;
    --ds-pos: #5DD68E; --ds-pos-soft: rgba(93, 214, 142, 0.14);
    --ds-neg: #FF8A80; --ds-neg-soft: rgba(255, 138, 128, 0.14);
    --ds-warn: #FFB65C; --ds-warn-soft: rgba(255, 182, 92, 0.14);
    --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.28) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #3D68F2 0%, #2950F4 55%, #1C38C2 100%);
    --ds-glass: rgba(24, 40, 70, 0.62);
    --ds-glass-strong: rgba(24, 40, 70, 0.84);
    --ds-glass-line: rgba(255, 255, 255, 0.14);
    --ds-glass-edge: rgba(0, 0, 0, 0.4);
    --ds-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --ds-shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
    --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 16px rgba(0, 0, 0, 0.35);
    --ds-scrim: rgba(0, 0, 0, 0.55);
    --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ds-bg: #0A1224;
  --ds-bg-top: #13244A;
  --ds-surface: #152340;
  --ds-surface-2: #1C2C4D;
  --ds-fill: rgba(113, 157, 246, 0.12);
  --ds-fill-2: rgba(113, 157, 246, 0.2);
  --ds-ink: #EEF3FF;
  --ds-ink-2: #A9B6D0;
  --ds-ink-3: #77859F;
  --ds-line: rgba(189, 235, 251, 0.11);
  --ds-line-2: rgba(189, 235, 251, 0.2);
  --ds-tint: #8EB0FA;
  --ds-tint-soft: rgba(113, 157, 246, 0.18);
  --ds-btn: #3A62F5;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #5DD68E; --ds-pos-soft: rgba(93, 214, 142, 0.14);
  --ds-neg: #FF8A80; --ds-neg-soft: rgba(255, 138, 128, 0.14);
  --ds-warn: #FFB65C; --ds-warn-soft: rgba(255, 182, 92, 0.14);
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.28) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #3D68F2 0%, #2950F4 55%, #1C38C2 100%);
  --ds-glass: rgba(24, 40, 70, 0.62);
  --ds-glass-strong: rgba(24, 40, 70, 0.84);
  --ds-glass-line: rgba(255, 255, 255, 0.14);
  --ds-glass-edge: rgba(0, 0, 0, 0.4);
  --ds-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --ds-shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 16px rgba(0, 0, 0, 0.35);
  --ds-scrim: rgba(0, 0, 0, 0.55);
  --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: dark;
}
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 340px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.012em;
}
/* ── fin de los tokens comunes ── */

/* Variables propias de las apps de cuentas, ahora tomadas del sistema común */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root:not([data-ds]), :root[data-theme] {
  --bg: var(--ds-bg); --surface: var(--ds-surface); --ink: var(--ds-ink); --muted: var(--ds-ink-2); --line: var(--ds-line-2);
  --track: var(--ds-fill); --seg-on: var(--ds-surface); --accent: var(--ds-tint); --accent-bg: var(--ds-tint-soft); --on-accent: var(--ds-on-btn);
  --in: var(--ds-pos); --in-bg: var(--ds-pos-soft); --over: var(--ds-neg); --over-bg: var(--ds-neg-soft);
  --card-a: var(--ds-b2); --card-b: var(--ds-b1); --card-shade: rgba(14, 27, 80, 0.32); --card-edge: rgba(255, 255, 255, 0.22);
  --on-card: var(--ds-hero-ink); --on-card-muted: var(--ds-hero-ink-2); --on-card-line: var(--ds-hero-line);
  --lime: #FFFFFF; --lime-ink: var(--ds-b1); --warn-soft: #FFE3A3; --busy: #F5A524; --scrim: var(--ds-scrim);
  --gold: var(--ds-b5); --gold-soft: #FFE3A3; --gold-line: var(--ds-b2);
  --ember: var(--ds-b5); --amber: #FFE3A3; --alarm: #FF8A80;
  --dot-1: var(--ds-b5); --dot-2: var(--ds-b4); --dot-3: var(--ds-b3); --dot-4: #FFFFFF;
  --tit: var(--ds-b1); --tit-ink: #2141D6; --tit-bg: var(--ds-tint-soft);
  --adi: #2E9BD6; --adi-ink: #146896; --adi-bg: #DDF3FC;
  --font-display: var(--ds-font-display); --font-body: var(--ds-font);
  --piti: #2950F4; --piti-bg: #E5ECFE; --emi: #0B85BD; --emi-bg: #DCF2FB; --on-person: #FFFFFF;
  --done: var(--ds-pos); --done-bg: var(--ds-pos-soft); --on-done: #FFFFFF; --warn: var(--ds-warn);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --piti: #8EB0FA; --piti-bg: rgba(113, 157, 246, 0.18); --emi: #7FD3F5; --emi-bg: rgba(127, 211, 245, 0.15); --on-person: #0A1224; --on-done: #0A1224;
    --tit: #8EB0FA; --tit-ink: #B9CDFC; --tit-bg: rgba(113, 157, 246, 0.18);
    --adi: #7FD3F5; --adi-ink: #BDEBFB; --adi-bg: rgba(127, 211, 245, 0.15);
  }
}
:root[data-theme="dark"] {
    --piti: #8EB0FA; --piti-bg: rgba(113, 157, 246, 0.18); --emi: #7FD3F5; --emi-bg: rgba(127, 211, 245, 0.15); --on-person: #0A1224; --on-done: #0A1224;
  --tit: #8EB0FA; --tit-ink: #B9CDFC; --tit-bg: rgba(113, 157, 246, 0.18);
  --adi: #7FD3F5; --adi-ink: #BDEBFB; --adi-bg: rgba(127, 211, 245, 0.15);
}

/*DS:TOKENS:END*/html.lock { overflow: hidden; }
/* Sin zoom con los dedos ni con doble toque: la app se usa como app instalada, no como página */
html { touch-action: pan-x pan-y; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 480px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 18px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.muted { color: var(--muted); margin: 0; }
.fine { font-size: 14px; }
svg { display: block; }

/* Encabezado */
.top { display: flex; align-items: center; gap: 12px; }
.mark { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, var(--card-a), var(--card-b)); color: var(--amber); display: grid; place-items: center; flex: none; }
.top h1 { font-size: 28px; font-weight: 700; line-height: 1.1; }

/* Botones */
.btn {
  min-height: 52px; padding: 0 18px; border-radius: 14px; border: 1.5px solid transparent; box-sizing: border-box;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; cursor: pointer;
}
.btn:active { opacity: 0.85; }
a.btn { text-decoration: none; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.tonal { background: var(--accent-bg); color: var(--ink); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.plus { background: transparent; border-color: var(--in); color: var(--in); }
.btn.danger { background: transparent; border-color: var(--over); color: var(--over); }
.btn.danger.armed { background: var(--over); color: var(--bg); }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.btn.block { width: 100%; }
.btn.big { min-height: 58px; font-size: 16px; border-radius: 16px; padding: 0 12px; }
.linkbtn { background: none; border: 0; padding: 0 6px; min-height: 44px; color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; align-self: center; }

/* Cupo: la tarjeta */
.hero {
  position: relative; overflow: hidden; border-radius: 24px; padding: 18px 20px 18px;
  background: linear-gradient(135deg, var(--card-a), var(--card-b)); color: var(--on-card);
  box-shadow: inset 0 0 0 1px var(--card-edge);
  display: flex; flex-direction: column; gap: 8px;
}
.hero::before {
  content: ""; position: absolute; left: -90px; bottom: -150px; width: 320px; height: 320px; border-radius: 50%;
  background: radial-gradient(closest-side, var(--ember), transparent); opacity: 0.3; pointer-events: none;
}
.hero-art { position: absolute; right: -4px; bottom: -10px; width: auto; height: 104px; opacity: 0.14; pointer-events: none; color: var(--amber); }
.hero > *:not(.hero-art) { position: relative; z-index: 1; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.hero .eyebrow { color: var(--on-card-muted); }
.hero-btn {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--on-card-line); background: transparent;
  color: var(--on-card); font-weight: 600; font-size: 14px; flex: none;
}
.hero-btn:active { opacity: 0.8; }
.hero-btn:focus-visible { outline-color: var(--on-card); }
.total {
  font-family: var(--font-display); font-weight: 700; line-height: 1; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere; margin: 2px 0;
}
.total.xl { font-size: min(60px, 15.5vw); }
.total.lg { font-size: min(50px, 13vw); }
.total.md { font-size: min(42px, 11vw); }
.total.sm { font-size: min(34px, 9vw); }
.total.word { font-size: min(34px, 9vw); letter-spacing: -0.02em; }
.meter { height: 10px; border-radius: 999px; background: var(--on-card-line); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; min-width: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--amber), var(--ember)); }
.meter.zero i { min-width: 0; }
.meter.full i { background: var(--alarm); }
.hero-note { margin: 0; font-size: 15px; font-weight: 500; color: var(--on-card-muted); }
.hero-note.warn { color: var(--amber); }
.hero-cta { align-self: flex-start; min-height: 46px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--amber); color: #2a1206; font-weight: 700; margin-top: 4px; }
.hero-stats { margin: 6px 0 0; padding-top: 12px; border-top: 1px solid var(--on-card-line); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hero-stats div { min-width: 0; }
.hero-stats dt { font-size: 13px; color: var(--on-card-muted); }
.hero-stats dd { margin: 2px 0 0; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-stats small { display: block; margin-top: 2px; font-size: 12px; line-height: 1.3; color: var(--on-card-muted); }

/* Acciones principales */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions .btn { min-width: 0; }
.sync { display: flex; align-items: center; justify-content: center; gap: 8px; margin: -8px 0 0; font-size: 14px; color: var(--muted); text-align: center; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--in); flex: none; }
.sync.busy i { background: var(--tit); }
.sync.bad { color: var(--over); font-weight: 600; }
.sync.bad i { background: var(--over); }
.sync.plain { display: block; margin: -6px 0 0; }
.under { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 14px; margin-top: -14px; }

/* Primeros pasos */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.step {
  width: 100%; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 12px 12px; min-height: 64px;
}
.step:active { background: var(--track); }
.step-n { width: 34px; height: 34px; border-radius: 999px; background: var(--accent-bg); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.step.done .step-n { background: var(--in-bg); color: var(--in); }
.step-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.step-t b { font-weight: 600; }
.step-t span { font-size: 14px; color: var(--muted); }

/* Secciones */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
.sec-head h2 { font-size: 22px; }
.sec-head .btn { flex: none; white-space: nowrap; }
.sec-note { font-size: 14px; color: var(--muted); text-align: right; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.T { background: var(--tit-bg); color: var(--tit-ink); }
.pill.A { background: var(--adi-bg); color: var(--adi-ink); }
.pill.new { background: var(--ink); color: var(--bg); margin-left: 6px; vertical-align: 1px; }

/* Totales por tarjeta */
.split { display: flex; gap: 3px; height: 10px; }
.split i { display: block; min-width: 6px; border-radius: 999px; }
.split .T { background: var(--tit); }
.split .A { background: var(--adi); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .who { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 15px; }
.tile .who i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.tile.T .who i { background: var(--tit); }
.tile.A .who i { background: var(--adi); }
.tile b { font-family: var(--font-display); font-weight: 700; font-size: min(26px, 6.6vw); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.15; }
.tile small { font-size: 14px; color: var(--muted); }
.sums { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.sums div { flex: 1 1 150px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 2px; min-width: 0; }
.sums dt { font-size: 14px; color: var(--muted); }
.sums dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sums dd.in { color: var(--in); }

/* Compras en cuotas */
.cuotas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cq { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.cq.done { background: transparent; }
.cq-head { width: 100%; text-align: left; background: none; border: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.cq-head .store { font-weight: 600; overflow-wrap: anywhere; }
.cq-head .amt { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cq-head .meta { grid-column: 1 / -1; }
.cq-bar { display: flex; gap: 3px; height: 10px; }
.cq-bar i { flex: 1 1 0; min-width: 0; border-radius: 3px; background: var(--track); }
.cq-bar i.on { background: var(--in); }
.cq-bar i.cur { background: var(--ink); }
.cq-nums { margin: 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; }
.cq-nums div { min-width: 0; }
.cq-nums dt { font-size: 13px; color: var(--muted); }
.cq-nums dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cq-when { margin: 0; font-size: 13px; color: var(--muted); }
.cq-total { margin: 0; padding: 12px 14px; border-radius: 16px; background: var(--accent-bg); display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.cq-total div { min-width: 0; }
.cq-total dt { font-size: 13px; color: var(--muted); }
.cq-total dd { margin: 0; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fold { border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; }
.fold summary { min-height: 48px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
.fold[open] { padding-bottom: 14px; }
.fold > *:not(summary) { margin-top: 4px; }
.fold > .guide, .fold > .note { margin-top: 12px; }

/* Listado */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-weight: 600; font-size: 15px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row {
  width: 100%; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 10px 10px; min-height: 62px;
}
.row:active { background: var(--track); }
.row.old { background: transparent; }
.ico { width: 38px; height: 38px; border-radius: 999px; background: var(--track); color: var(--muted); display: grid; place-items: center; flex: none; }
.ico.in { background: var(--in-bg); color: var(--in); }
.info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.store { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 14px; color: var(--muted); }
.cq-head .meta .pill { margin-right: 6px; }
.nums { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.amt { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.in { color: var(--in); }
.kind { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.anchor { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-weight: 600; text-align: center; padding: 4px 2px; }
.anchor::before, .anchor::after { content: ""; flex: 1; min-width: 12px; border-top: 1.5px dashed var(--line); }
.anchor span { min-width: 0; }
.empty { margin: 0; padding: 16px; border: 1.5px dashed var(--line); border-radius: 16px; color: var(--muted); }
.foot { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }

/* Datos y respaldo */
.backup { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; }
.backup summary { min-height: 48px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
.backup[open] { padding-bottom: 16px; }
.backup > *:not(summary) { margin-top: 10px; }
.backup textarea, .field textarea { width: 100%; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); padding: 10px 12px; font-size: 16px; resize: vertical; }
.backup textarea { font-family: ui-monospace, Menlo, monospace; }
.bk-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.bk-actions .btn { flex: 1; min-width: 0; min-height: 48px; }

/* Hojas */
.sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); }
.panel {
  position: relative; width: 100%; max-width: 480px; max-height: 94%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 24px 24px 0 0; box-sizing: border-box;
  padding: 22px 16px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px; animation: rise 0.2s ease-out;
}
.panel:focus { outline: none; }
.panel h2 { font-size: 24px; }
.panel h3 { font-size: 18px; }
.panel .sub { margin: -8px 0 0; color: var(--muted); font-size: 15px; }
.panel .sub strong, .note strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span { font-size: 14px; font-weight: 600; padding: 0; }
.field input[type="date"], .field input[type="time"], .field input[type="text"] {
  display: block; width: 100%; min-width: 0; min-height: 52px; box-sizing: border-box;
  -webkit-appearance: none; appearance: none; font-size: 16px;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--bg); color: var(--ink);
}
.field textarea { font-size: 16px; min-height: 104px; }
.field .hint { font-size: 14px; font-weight: 400; color: var(--muted); }
.pair { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 10px; }
.price-wrap { position: relative; }
.price-wrap b { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
.price-wrap input { padding-left: 30px !important; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 16px; background: var(--track); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { min-height: 44px; min-width: 0; border-radius: 12px; border: 0; background: transparent; font-weight: 600; color: var(--muted); padding: 0 4px; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); }
.stepper { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 8px; }
.stepper button { min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); display: grid; place-items: center; padding: 0; }
.stepper button:active { background: var(--track); }
.stepper input { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.step-val { display: grid; place-items: center; min-height: 52px; min-width: 0; box-sizing: border-box; padding: 0 8px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); font-weight: 600; text-align: center; }
.err { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--over-bg); color: var(--over); font-weight: 600; font-size: 15px; }
.note { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-bg); color: var(--ink); font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.found { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.found li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 12px; border-radius: 12px; background: var(--bg); font-size: 15px; }
.found li b { font-weight: 600; overflow-wrap: anywhere; }
.found li i { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.found li span { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.guide { margin: 0; padding: 0; list-style: none; counter-reset: paso; display: flex; flex-direction: column; gap: 12px; }
.guide li { counter-increment: paso; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; font-size: 15px; }
.guide li::before { content: counter(paso); width: 28px; height: 28px; border-radius: 999px; background: var(--accent-bg); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.guide li > div { min-width: 0; overflow-wrap: anywhere; }
.guide strong { font-weight: 600; }
.guide .btn { margin-top: 8px; }
.raw { margin: 6px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--surface); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; max-height: 120px; overflow-y: auto; }
.mails { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.mails li { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--bg); font-size: 14px; }
.mails b { font-weight: 600; font-size: 15px; }
.mails span { color: var(--muted); overflow-wrap: anywhere; }
.mails li.ok b { color: var(--in); }
.mails li.bad b, .mails li.new b { color: var(--over); }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 14px; background: var(--track); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }

/* Extracto */
.ext-kv { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.ext-kv div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ext-kv dt { color: var(--muted); min-width: 0; }
.ext-kv dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ext-kv dd.in { color: var(--in); }
.ext-kv .sum { padding-top: 6px; border-top: 1px solid var(--line); }
.ext-kv .sum dt { color: var(--ink); font-weight: 600; }
.ext-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.ext-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.ext-list b { font-weight: 600; overflow-wrap: anywhere; }
.ext-list i { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ext-list i.in { color: var(--in); }
.ext-list span { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.ext-total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 16px; background: linear-gradient(135deg, var(--card-a), var(--card-b)); box-shadow: inset 0 0 0 1px var(--card-edge); color: var(--on-card); }
.ext-total span { font-weight: 600; }
.ext-total b { font-family: var(--font-display); font-size: min(30px, 7.6vw); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }

.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 448px; margin: 0 auto; z-index: 20;
  background: var(--ink); color: var(--bg); padding: 8px 16px; min-height: 48px; box-sizing: border-box; border-radius: 14px; font-size: 15px;
  display: flex; align-items: center; justify-content: center; gap: 14px; text-align: center;
}
.toast.top { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }
.toast button { background: none; border: 0; padding: 0 4px; min-height: 44px; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; flex: none; }

/*DS:LAYER:START*/
/* ── Domésticas · base común (v1) ── */
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 360px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--ds-font-display); letter-spacing: -0.022em; }
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--ds-tint-soft); }
:focus-visible { outline-color: var(--ds-tint); }
input, select, textarea { accent-color: var(--ds-btn); caret-color: var(--ds-tint); }
@keyframes ds-rise { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
.mark.app-icon, img.app-icon { display: block; overflow: hidden; padding: 0; background: none; object-fit: cover; border-radius: 23%; box-shadow: 0 0 0 0.5px rgba(14, 27, 51, 0.08), 0 4px 12px rgba(41, 80, 244, 0.25); }
/* ── fin de la base común ── */

/* ── Domésticas · componentes (familia de cuentas: Copec, FAN, Master, LiderBCI) ── */
body { font-size: 17px; line-height: 1.38; }
.app { gap: 20px; padding-block: 14px 48px; }
.eyebrow { font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: -0.005em; color: var(--ds-ink-2); }
.muted { color: var(--ds-ink-2); }

/* Encabezado con título grande */
.top { gap: 12px; padding-top: 6px; }
.top h1 { font-size: 34px; line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; }
.mark {
  width: 46px; height: 46px; border-radius: 13px; color: #fff; background: var(--ds-hero);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 -1px 0 rgba(14, 27, 51, 0.18), 0 4px 12px rgba(41, 80, 244, 0.28);
}
.mark svg, .mark img { filter: drop-shadow(0 1px 1px rgba(14, 27, 51, 0.25)); }

/* Botones: cápsulas, relleno sólido o tintado */
.btn {
  min-height: 50px; border-radius: var(--ds-r-pill); border: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
  transition: transform 0.16s ease, opacity 0.16s ease, background-color 0.16s ease;
}
.btn:active { transform: scale(0.97); opacity: 0.88; }
.btn.primary { background: var(--ds-btn); color: var(--ds-on-btn); box-shadow: var(--ds-shadow-btn); }
.btn.tonal { background: var(--ds-tint-soft); color: var(--ds-tint); }
.btn.ghost { background: var(--ds-surface); color: var(--ds-tint); border: 0; box-shadow: var(--ds-shadow-1); }
.btn.plus { background: var(--ds-surface); color: var(--ds-pos); border: 0; box-shadow: var(--ds-shadow-1); }
.btn.danger { background: var(--ds-neg-soft); color: var(--ds-neg); border: 0; }
.btn.danger.armed { background: var(--ds-neg); color: #fff; }
.btn.small { min-height: 40px; padding: 0 16px; font-size: 15px; }
.btn.big { min-height: 58px; border-radius: 20px; font-size: 16px; line-height: 1.2; }
.linkbtn { color: var(--ds-tint); text-decoration: none; font-size: 15px; }

/* Tarjeta principal: degradado de la paleta con brillo de vidrio */
.hero {
  border-radius: 28px; padding: 20px 20px 18px; background: var(--ds-hero); color: var(--ds-hero-ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), inset 0 -1px 0 rgba(14, 27, 51, 0.16), 0 16px 34px rgba(41, 80, 244, 0.26);
}
.hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 38%); }
.hero-mark, .hero-art { opacity: 0.12; }
.hero .eyebrow, .hero-note { color: var(--ds-hero-ink-2); }
.hero-btn, .hero .chip, .hero button.ghost {
  background: var(--ds-hero-glass); border: 0.5px solid rgba(255, 255, 255, 0.45); color: #fff;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
}
.hero-cta { border-radius: var(--ds-r-pill); background: #fff; color: var(--ds-b1); font-weight: 700; padding: 0 20px; box-shadow: 0 6px 16px rgba(14, 27, 51, 0.2); }
.total { font-family: var(--ds-font-round); font-weight: 700; letter-spacing: -0.025em; }
.hero-stats { border-top-color: var(--ds-hero-line); }
.hero-stats dt { color: var(--ds-hero-ink-2); }

/* Encabezados de sección */
.sec-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; }
.sync { color: var(--ds-ink-2); }

/* Listas agrupadas (estilo Ajustes de iOS) */
.list, .steps {
  gap: 0; background: var(--ds-surface); border-radius: var(--ds-r-card); overflow: hidden; box-shadow: var(--ds-shadow-1);
}
.row, .step {
  position: relative; border: 0; border-radius: 0; background: transparent; min-height: 60px; padding: 11px 16px 11px 14px;
}
.row:active, .step:active { background: var(--ds-fill); }
.row.old { background: transparent; opacity: 0.62; }
.list > li + li > .row::before, .steps > li + li > .step::before {
  content: ""; position: absolute; top: 0; right: 0; left: 64px; border-top: 0.5px solid var(--ds-line-2);
}
.ico { width: 38px; height: 38px; background: var(--ds-fill); color: var(--ds-ink-2); }
.ico.in { background: var(--ds-pos-soft); color: var(--ds-pos); }
.ico.auto { background: var(--ds-tint-soft); color: var(--ds-tint); }
.store { font-weight: 600; }
.meta, .run { color: var(--ds-ink-2); }
.amt { font-weight: 600; }
.amt.in { color: var(--ds-pos); }
.tag { background: var(--ds-tint-soft); color: var(--ds-tint); }
.step-n { background: var(--ds-tint-soft); color: var(--ds-tint); }
.step.done .step-n { background: var(--ds-pos-soft); color: var(--ds-pos); }
.step-t span { color: var(--ds-ink-2); }
.anchor { color: var(--ds-ink-3); padding: 8px 16px; }
.anchor::before, .anchor::after { border-top: 0.5px solid var(--ds-line-2); }
.empty { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); color: var(--ds-ink-2); padding: 18px; }
.foot { color: var(--ds-ink-3); }

/* Filtros en cápsula */
.chip { border: 0; background: var(--ds-fill); color: var(--ds-ink); font-weight: 600; min-height: 36px; padding: 0 15px; }
.chip[aria-pressed="true"] { background: var(--ds-btn); color: #fff; }

/* Datos y respaldo */
.backup { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); }
.backup textarea, .field textarea { border: 0; border-radius: var(--ds-r-field); background: var(--ds-surface-2); }

/* Hojas (sheets) */
.backdrop { background: var(--ds-scrim); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.panel {
  background: var(--ds-surface); border-radius: var(--ds-r-sheet) var(--ds-r-sheet) 0 0; padding-top: 30px;
  box-shadow: 0 -10px 40px rgba(14, 27, 51, 0.18); animation: ds-rise 0.28s cubic-bezier(0.2, 0.9, 0.25, 1);
}
.panel::before { content: ""; position: absolute; top: 8px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--ds-line-2); }
.panel h2 { font-size: 24px; font-weight: 700; }
.panel .sub { color: var(--ds-ink-2); }
.field > span { font-size: 13px; font-weight: 600; color: var(--ds-ink-2); padding-left: 4px; }
.field input[type="date"], .field input[type="time"], .field input[type="text"], .field input[type="url"], .field input[type="number"], .field input:not([type]), .field select {
  border: 1.5px solid transparent; border-radius: var(--ds-r-field); background: var(--ds-surface-2); min-height: 50px;
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--ds-tint); box-shadow: 0 0 0 4px var(--ds-tint-soft); }
.price-wrap b { color: var(--ds-ink-3); }

/* Control segmentado en cápsula */
.seg { background: var(--ds-fill); border-radius: var(--ds-r-pill); padding: 4px; gap: 4px; }
.seg button { border-radius: var(--ds-r-pill); min-height: 40px; color: var(--ds-ink-2); }
.seg button[aria-pressed="true"] { background: var(--ds-surface); color: var(--ds-ink); box-shadow: 0 2px 8px rgba(14, 27, 51, 0.12), 0 0 0 0.5px rgba(14, 27, 51, 0.04); }

/* Avisos y notas */
.err { border-radius: var(--ds-r-field); background: var(--ds-neg-soft); color: var(--ds-neg); }
.note { border-radius: var(--ds-r-field); background: var(--ds-tint-soft); color: var(--ds-ink); }
.found li, .mails li { border-radius: 14px; background: var(--ds-surface-2); }
.guide li::before { background: var(--ds-tint-soft); color: var(--ds-tint); }
.peek summary, .how summary { color: var(--ds-tint); }
.how summary { color: var(--ds-ink); }
.raw { background: var(--ds-surface-2); border-radius: 12px; }
.mono { background: var(--ds-fill); font-family: var(--ds-font-mono); }

/* Aviso flotante de vidrio */
.toast {
  border-radius: var(--ds-r-pill); background: rgba(14, 27, 51, 0.86); color: #fff; padding: 8px 20px;
  -webkit-backdrop-filter: var(--ds-glass-blur); backdrop-filter: var(--ds-glass-blur);
  box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.25), 0 10px 30px rgba(14, 27, 51, 0.3);
}
/* ── fin de componentes ── */
/* Tarjetas secundarias (Master: por tarjeta, cuotas; plegables) */
.tile, .cq { border: 0; border-radius: 20px; background: var(--ds-surface); box-shadow: var(--ds-shadow-1); }
.fold { border: 0; border-radius: var(--ds-r-card); background: var(--ds-surface); box-shadow: var(--ds-shadow-1); }

  var WIDGET_CODE = /*WIDGET:START*/"// Variables used by Scriptable.\n// These must be at the very top of the file. Do not edit.\n// icon-color: orange; icon-glyph: credit-card;\n\n// Master · widget para la pantalla de inicio del iPhone (app Scriptable)\n//\n// Muestra el disponible, el utilizado y las tres últimas compras con la tarjeta. Parte de lo que Master publica\n// en el buzón (el repositorio privado de GitHub) y le suma las compras que llegaron después, aunque no hayas\n// abierto Master. No copies este archivo a mano: usa el botón «Copiar el script del widget» de Master, que\n// completa las dos líneas siguientes con tu repositorio y tu token.\nconst REPO = '__REPO__';\nconst TOKEN = '__TOKEN__';\n\nconst API = 'https://api.github.com/repos/' + REPO;\nconst MS_TITLE = 'Master · widget';\nconst MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];\n\n/* ---------- Formatos y fechas ---------- */\nfunction pad(n) { return (n < 10 ? '0' : '') + n; }\nfunction dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }\nfunction dots(n) { return String(Math.round(Math.abs(n))).replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.'); }\nfunction money(n) { return (n < 0 ? '−' : '') + '$' + dots(n); }\nfunction hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }\nfunction dayLabel(k) {\n  const t = new Date(), y = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1);\n  if (k === dayKey(t)) return 'hoy';\n  if (k === dayKey(y)) return 'ayer';\n  const p = k.split('-');\n  return (+p[2]) + ' ' + MES[+p[1] - 1];\n}\nfunction validDate(k) {\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(k)) return false;\n  const p = k.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));\n  return d.getUTCFullYear() === +p[0] && d.getUTCMonth() === +p[1] - 1 && d.getUTCDate() === +p[2];\n}\n\n/* ---------- Lector de los avisos del banco (el mismo de Master) ---------- */\nconst CP1252 = { 0x20ac: 0x80, 0x201a: e script desde Master, con el botón «Copiar el script del widget».' };\n} else {\n  try {\n    res = await load();\n    if (!res.msg) writeCache(res);\n  } catch (e) {\n    const c = readCache();\n    if (c && !c.msg && typeof c.avail === 'number') { res = c; res.old = true; }\n    else res = { msg: e && e.status === 401 ? 'El token venció. Copia de nuevo el script desde Master.' : 'No se pudo leer el buzón. Revisa la conexión.' };\n  }\n}\nconst widget = build(res, config.widgetFamily);\nwidget.refreshAfterDate = new Date(Date.now() + 10 * 60 * 1000);\nif (config.runsInWidget) Script.setWidget(widget);\nelse await widget.presentMedium();\nScript.complete();\n"/*WIDGET:END*/;

      if (m.type !== type || (type !== 'c' && m.src !== 'manual')) continue;
      var k = m.desc.toLowerCase();
      if (!seen[k]) { seen[k] = 1; out.push(m.desc); }
    }
    return out;
  }

  async function commit(ups, rems, newCfg) {
    ups = (ups || []).map(norm).filter(Boolean); rems = rems || [];
    var next = items.filter(function (p) { return rems.indexOf(p.id) < 0 && !ups.some(function (u) { return u.id === p.id; }); }).concat(ups);
    if (mode === 'db' && db) {
      try {
        for (var i = 0; i < ups.length; i++) await db.collection(COL).doc(ups[i].id).set(toDoc(ups[i]));
        for (var j = 0; j < rems.length; j++) await db.collection(COL).doc(rems[j]).delete();
        if (newCfg) await db.doc(CFG_PATH).set({ limit: newCfg.limit, desde: newCfg.desde, saldo: newCfg.saldo, ignored: newCfg.ignored });
      } catch (e) { toast('No se pudo guardar. Intenta de nuevo.'); return false; }
    }
    items = next; sortItems();
    if (newCfg) { cfg = newCfg; rawCfg = newCfg; }
    if (mode !== 'db') saveLocal();
    render();

  }
  // Aplica un cambio de varios registros y ofrece deshacerlo
  async function applyUndoable(ups, rems, nextCfg, msg) {
    var prevCfg = cfg, snap = {}, created = [];
    ups.forEach(function (u) { var o = find(u.id); if (o) snap[u.id] = copyOf(o); else created.push(u.id); });
    rems.forEach(function (id) { var o = find(id); if (o) snap[id] = copyOf(o); });
    busy = true;
    var ok = await commit(ups, rems, nextCfg);
    busy = false;
    if (!ok) return false;
    toast(msg, 'Deshacer', function () {
      commit(Object.keys(snap).map(function (k) { return snap[k]; }), created, prevCfg).then(function (r) { if (r) toast('Cambio deshecho'); });
    }, 9000);
    return true;
  }

  function toast(msg, actLabel, actFn, ms) {
    toastEl.textContent = '';

    s.textContent = msg;
    toastEl.appendChild(s);

      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = actLabel;
      b.addEventListener('click', function () { toastEl.hidden = true; clearTimeout(toast.t); actFn(); });
      toastEl.appendChild(b);
    }
    toastEl.classList.toggle('top', !!sheet);
    toastEl.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { toastEl.hidden = true; }, ms || 3600);
  }

  function copyText(text, okMsg) {
    function legacy() {
      var ta = document.createElement('textarea');

      ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.left = '0'; ta.style.top = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}

    try {

  }

  /* ---------- Traer compras: buzón de avisos o texto pegado ---------- */
  // Una compra anotada a mano, sin aviso, del mismo día y por el mismo monto (de preferencia, de la misma tarjeta):
  // el aviso se une a ella en vez de duplicarla.
  function twinOf(p, taken) {
    var best = null;
    items.forEach(function (m) {
      if (m.type !== 'c' || m.key || (taken && taken[m.id]) || m.date !== p.date || m.amount !== p.amount) return;
      if (!best || (m.who === p.who && best.who !== p.who)) best = m;
    });
    return best;
  }
  // Qué hacer con cada compra leída: 'new' se agrega, 'link' se une a una compra anotada a mano, 'known' ya estaba
  // y 'old' es anterior al saldo (ya está dentro de él)
  function pending(parsed, source) {
    var have = {}, ign = {}, taken = {}, out = { ups: [], added: [], known: 0, back: [], old: 0, linked: 0, st: {} };
    items.forEach(function (m) { if (m.key) have[skel(m.key)] = 1; });
    cfg.ignored.forEach(function (k) { ign[skel(k)] = 1; });
    parsed.found.forEach(function (p) {
      var sk = skel(p.key);
      if (have[sk]) { out.known++; out.st[p.key] = 'known'; return; }
      have[sk] = 1;
      if (cfg.desde && p.date < cfg.desde) { out.old++; out.st[p.key] = 'old'; return; }
      if (ign[sk]) {
        if (source === 'box') { out.known++; out.st[p.key] = 'known'; return; }   // se eliminó a propósito: el buzón no la devuelve
        out.back.push(sk);                                                       // pegarla a mano sí la recupera
      }
      var twin = twinOf(p, taken);
      if (twin) {
        taken[twin.id] = 1; out.linked++; out.st[p.key] = 'link';
        out.ups.push(copyOf(twin, { src: 'mail', key: p.key, card: p.card, who: p.who, time: p.time, n: twin.n > 1 ? twin.n : p.n }));
        return;
      }
      out.st[p.key] = 'new';
      var rec = { id: 'm' + hash(p.key), type: 'c', date: p.date, time: p.time, desc: p.merchant, amount: p.amount, src: 'mail', key: p.key, card: p.card, who: p.who, n: p.n, ts: Date.now() };
      out.ups.push(rec); out.added.push(rec);
    });
    return out;
  }
  function skippedNote(parsed) {
    var parts = [];
    if (parsed.foreign) parts.push(parsed.foreign + ' en dólares');
    if (parsed.other) parts.push(parsed.other + ' de otra tarjeta' + (parsed.otherCard ? ' (··' + parsed.otherCard + ')' : ''));
    return parts.length ? ' Sin contar: ' + parts.join(' y ') + '.' : '';
  }
  // Agrega las compras leídas que falten y cuenta qué pasó, para que cada origen arme su mensaje
  async function addParsed(parsed, source) {
    var res = pending(parsed, source), out = { ok: true, found: parsed.found.length, added: 0, sum: 0, old: res.old, linked: res.linked };
    if (!res.ups.length) return out;
    var newCfg = res.back.length ? withCfg({ ignored: cfg.ignored.filter(function (x) { return res.back.indexOf(skel(x)) < 0; }) }) : null;
    busy = true;
    out.ok = await commit(res.ups, [], newCfg);
    busy = false;
    if (!out.ok) return out;
    fresh = {};
    res.added.forEach(function (u) { fresh[u.id] = 1; out.sum += u.amount; });
    out.added = res.added.length;
    filter = 'all'; shown = PAGE;
    return out;
  }
  function addedMsg(r, parsed) {
    var parts = [];
    if (r.added) parts.push(r.added + ' ' + plural(r.added, 'compra nueva', 'compras nuevas') + ' · ' + money(r.sum) + '.');
    if (r.linked) parts.push(r.linked + ' ' + plural(r.linked, 'aviso coincidió con una compra anotada a mano y no se duplicó.', 'avisos coincidieron con compras anotadas a mano y no se duplicaron.'));
    return parts.join(' ') + (parsed ? skippedNote(parsed) : '');
  }
  async function importPaste() {
    if (busy) return;
    var parsed = parseMail(val('f-paste'));
    if (!parsed.found.length) { pastePreview(); return; }
    var r = await addParsed(parsed, 'paste');
    if (!r.ok) return;
    closeSheet(); render();
    toast(r.added || r.linked ? addedMsg(r, parsed)
      : r.old === r.found ? (r.found === 1 ? 'Esa compra es anterior' : 'Esas compras son anteriores') + ' al ' + fmt(cfg.desde) + ': ya ' + plural(r.found, 'está', 'están') + ' dentro del saldo anterior.'
      : r.found === 1 ? 'Esa compra ya estaba registrada.' : 'Esas compras ya estaban registradas.', null, null, 5200);
  }

  // Buzón: un repositorio privado de GitHub donde Atajos deja cada correo del banco como un «issue».
  function fetchError(status) { var e = new Error('http'); e.status = status; return e; }
  function issueMsg(it) {
    var title = String(it.title || '');   // el título solo cuenta si trae el aviso; «Aviso» a secas es la etiqueta del atajo
    return { text: (title.length > 20 ? title + '\n' : '') + String(it.body || ''), at: Date.parse(it.created_at) || 0 };
  }
  async function fetchBox(repo, token, since) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 45000);
    var out = [];
    try {
      for (var page = 1; page <= MAX_PAGES; page++) {
        var url = API + repo + '/issues?state=all&sort=created&direction=asc&per_page=100&page=' + page +
          (since ? '&since=' + encodeURIComponent(new Date(since).toISOString().replace(/\.\d+Z$/, 'Z')) : '');
        var res = await fetch(url, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }, cache: 'no-store', signal: ctl ? ctl.signal : undefined });
        if (!res.ok) throw fetchError(res.status);
        var list = await res.json();
        if (!Array.isArray(list)) throw new Error('formato');
        list.forEach(function (it) { if (it && !it.pull_request) out.push(issueMsg(it)); });
        if (list.length < 100) break;
      }
      return out;
    } finally { clearTimeout(timer); }
  }
  // Revisión del buzón: los últimos correos que llegaron, del más reciente al más antiguo, y qué hizo la app con cada uno.
  // Sirve para saber si un correo que no aparece se quedó en Atajos (no llegó al buzón) o llegó y no era una compra con la tarjeta.
  async function fetchLatest(n) {
    var res = await fetch(API + prefs.repo + '/issues?state=all&sort=created&direction=desc&per_page=' + n,
      { headers: { Authorization: 'Bearer ' + prefs.token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (!res.ok) throw fetchError(res.status);
    var list = await res.json();
    if (!Array.isArray(list)) throw new Error('formato');
    return list.filter(function (it) { return it && !it.pull_request; }).map(issueMsg).sort(function (a, b) { return b.at - a.at; });
  }
  function verdict(text) {
    var p = parseMail(text);
    if (p.found.length) {
      var f = p.found[0], fk = skel(f.key), what = f.merchant + ' · ' + money(f.amount) + ' · ' + WHO[f.who];
      if (items.some(function (m) { return m.key && skel(m.key) === fk; })) return { k: 'ok', label: 'Compra registrada', detail: what };
      if (cfg.desde && f.date < cfg.desde) return { k: 'skip', label: 'Compra anterior al ' + fmt(cfg.desde), detail: what + '. Ya está dentro del saldo anterior.' };
      if (cfg.ignored.some(function (k) { return skel(k) === fk; })) return { k: 'skip', label: 'Compra que eliminaste', detail: what };
      if (twinOf(f)) return { k: 'ok', label: 'Compra anotada a mano', detail: what + '. Se une a su aviso en la próxima lectura.' };
      return { k: 'new', label: 'Compra sin registrar todavía', detail: what + '. Toca «Leer el buzón ahora», más abajo.' };
    }
    var sk = p.skip[0];
    if (sk) {
      var seen = sk.merchant + ' · ' + sk.money + ' · ' + sk.medio;
      if (sk.kind === 'other') return { k: 'skip', label: 'Compra con otra tarjeta' + (sk.card ? ' (··' + sk.card + ')' : ''), detail: seen + '. Aquí se registran ' + Object.keys(CARDS).map(function (d) { return '··' + d; }).join(' y ') + '.' };
      if (sk.kind === 'foreign') return { k: 'skip', label: 'Compra en dólares', detail: seen + '. No usa el cupo en pesos.' };
      return { k: 'skip', acct: true, label: 'Compra con cargo a la cuenta', detail: seen + '. La registra FAN, no esta app.' };
    }
    return { k: 'bad', label: 'No lo reconozco como aviso de compra', detail: '' };
  }
  async function loadMails() {
    var s = sheet, list = [], err = '';
    try { list = await fetchLatest(8); } catch (e) { err = errMsg(errCode(e)); }
    var out = document.getElementById('f-mails');
    if (!out || sheet !== s) return;
    if (err) { out.innerHTML = '<p class="err">' + esc(err) + '</p>'; return; }
    if (!list.length) { out.innerHTML = '<p class="empty">El buzón está vacío: la automatización de Atajos todavía no ha enviado ningún correo.</p>'; return; }
    var lines = ['Master · últimos correos del buzón ' + prefs.repo], acct = 0;
    var h = '<p class="muted fine">El más reciente llegó ' + ago(list[0].at) + '. Si el correo que esperas no está en esta lista, Atajos no lo envió al buzón.</p><ul class="mails">';
    list.forEach(function (m) {
      var v = verdict(m.text), txt = plainText(m.text).trim(), d = new Date(m.at);
      if (v.acct) acct++;
      h += '<li class="' + v.k + '"><b>' + esc(v.label) + '</b><span>Llegó ' + ago(m.at) + (v.detail ? ' · ' + esc(v.detail) : '') + '</span>' +
        (v.k === 'bad' ? '<p class="raw">' + (txt ? esc(txt.slice(0, 400)) : 'El correo llegó sin texto.') + '</p>' : '') + '</li>';
      lines.push('', fmtNum(dayKey(d)) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' · ' + v.label + (v.detail ? ' · ' + v.detail : ''),
        (txt ? txt.slice(0, 600) : '(sin texto)') + ' [' + m.text.length + ' caracteres]');
    });
    // Si al buzón solo llegan compras de la cuenta, lo más probable es que Atajos esté filtrando por asunto
    var onlyAcct = list.length >= 3 && acct === list.length
      ? '<p class="note"><strong>Al buzón solo están llegando compras con cargo a la cuenta.</strong> Si la automatización de Atajos tiene una condición de asunto, quítala y deja solo el remitente, para que también lleguen los avisos de la tarjeta.</p>' : '';
    out.innerHTML = h + '</ul>' + onlyAcct + '<button type="button" class="btn ghost small" data-act="copy-mails">Copiar este detalle</button>';
    s.mails = lines.join('\n');
  }
  // Lee cada correo del buzón por separado: junta las compras con tarjeta y recuerda el último que no era una compra
  function parseBox(msgs) {
    var all = { found: [], account: 0, foreign: 0, other: 0, otherCard: '' }, seen = {}, note = null;
    msgs.forEach(function (m) {
      var p = parseMail(m.text);
      p.found.forEach(function (f) { if (!seen[f.key]) { seen[f.key] = 1; all.found.push(f); } });
      all.account += p.account; all.foreign += p.foreign; all.other += p.other;
      if (p.otherCard) all.otherCard = p.otherCard;
      if (!p.found.length && !p.account && !p.foreign && !p.other && (!note || m.at >= note.at)) note = m;
    });
    return { parsed: all, note: note ? { text: plainText(note.text).trim().slice(0, 600), at: note.at } : null };
  }
  function errCode(e) {

  }
  function errMsg(code) {
    return {
      token: 'El token de GitHub no es válido o venció. Crea uno nuevo y vuelve a conectar el buzón.',
      perm: 'El token no tiene permiso para leer el buzón. Debe tener «Issues: Read and write» en ese repositorio.',
      repo: 'No encuentro ese repositorio con ese token. Revisa el nombre y que el token tenga acceso a él.',
      issues: 'Ese repositorio tiene los Issues desactivados. Actívalos en Settings → Features.',
      offline: 'Sin conexión: no se pudo leer el buzón.',
      net: 'No se pudo leer el buzón. Intenta de nuevo en un momento.'
    }[code] || 'No se pudo leer el buzón.';
  }
  function ago(ts) {
    var d = new Date(ts), mins = Math.floor((Date.now() - ts) / 60000), hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (mins < 1) return 'hace un momento';
    if (mins < 60) return 'hace ' + mins + ' min';
    var day = dayLabel(dayKey(d));
    return (day === 'Hoy' ? 'hoy' : day === 'Ayer' ? 'ayer' : 'el ' + day) + ' a las ' + hm;
  }
  function keepBoxNotes(box) {
    if (box.note && (!prefs.note || box.note.at >= prefs.note.at)) prefs.note = box.note;
    if (box.parsed.otherCard) prefs.other = box.parsed.otherCard;
  }
  async function syncBox(manual, full) {
    if (!canSync || !prefs.repo || syncing || busy) return;
    syncing = true; syncErr = ''; lastTry = Date.now();
    render();
    var r = null, box = null, started = Date.now();
    try {
      var msgs = await fetchBox(prefs.repo, prefs.token, prefs.last && !full ? prefs.last - SYNC_MARGIN : 0);
      box = parseBox(msgs);
      r = await addParsed(box.parsed, 'box');
      if (r.ok) { prefs.last = started; keepBoxNotes(box); savePrefs(); }
    } catch (e) { syncErr = errCode(e); }
    syncing = false;
    render();
    if (r && r.ok && (r.added || r.linked)) toast(addedMsg(r, manual ? box.parsed : null), null, null, 5200);
    else if (manual && r && r.ok) toast('Al día: no hay compras nuevas con la tarjeta.' + skippedNote(box.parsed), 'Ver buzón', function () { openSheet('box'); }, 6500);
    else if (manual && syncErr) toast(errMsg(syncErr), null, null, 6000);
  }
  function autoSync() {
    if (canSync && prefs.repo && !sheet && !loading && Date.now() - lastTry > SYNC_EVERY) syncBox(false);
    else if (!sheet && !syncing) render();   // refresca «Hoy», «Ayer» y la hora de la última lectura
  }
  function cleanRepo(v) {
    return String(v || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
  }
  async function connectBox() {
    if (syncing || !sheet) return;
    // El token se puede pegar tal como lo copia FAN en «Copiar autorización» (con «Bearer» delante)
    var repo = cleanRepo(val('f-repo')), token = val('f-token').trim().replace(/^Bearer\s+/i, '');
    if (!REPO_RE.test(repo)) { setErr('Escribe el repositorio como usuario/nombre, por ejemplo ' + (OWNER || 'tu-usuario') + '/' + BOX + '.'); return; }
    if (token.length < 20 || /\s/.test(token)) { setErr('Pega el token completo, tal como lo entrega GitHub.'); return; }
    var btn = document.getElementById('f-connect'), msgs, started = Date.now();
    setErr('');
    syncing = true; sheet.testing = true;
    if (btn) { btn.disabled = true; btn.textContent = 'Probando la conexión…'; }

      msgs = await fetchBox(repo, token, 0);
    } catch (e) {

  }

  /* ---------- Widget de la pantalla de inicio (app Scriptable) ---------- */
  // Una app web no puede crear widgets. Master publica el utilizado y las últimas compras en un hito del buzón, y el
  // script de Scriptable los dibuja, sumando las compras que llegaron al buzón después. Solo se publica si se activa el widget.
  var widgetTimer = 0, widgetBusy = false, widgetErr = '';
  function widgetState() {
    var c = compute(), q = cuotasInfo(), cut = dayKey(new Date(Date.now() - 5 * 86400000)), keys = [], buys = [];
    for (var i = items.length - 1; i >= 0 && buys.length < 3; i--) {
      if (items[i].type === 'c') buys.push({ d: items[i].date, h: items[i].time, c: items[i].desc, m: items[i].amount, w: items[i].who });
    }
    items.forEach(function (m) { if (m.key && m.date >= cut) keys.push(skel(m.key)); });      // compras recientes ya contadas
    cfg.ignored.slice(-80).forEach(function (k) { keys.push(skel(k)); });                      // y las eliminadas a propósito
    return { v: 2, app: 'master', used: cfg.desde ? c.used : null, limit: cfg.limit, desde: cfg.desde,
      at: cfg.desde ? cfg.desde + 'T00:00' : '',   // para Panel Casa: los avisos anteriores ya están en el saldo
      read: prefs.last || 0, cards: CARDS,
      // Para Panel Casa: lo que falta por cobrar de cada compra en cuotas, con el mes de pago de la próxima cuota
      cuotas: q.active.map(function (m) { var st = cuotaState(m); return { a: st.pendAmt, n: st.pend, f: addMonths(st.next, 1) }; }),
      ult: buys, keys: keys };
  }
  async function ghJson(method, path, body) {
    var res = await fetch(API + prefs.repo + path, {
      method: method, cache: 'no-store', body: body ? JSON.stringify(body) : undefined,
      headers: { Authorization: 'Bearer ' + prefs.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }
    });
    if (!res.ok) throw fetchError(res.status);
    return res.json();
  }
  async function publishWidget() {
    // Se espera a que el buzón se haya leído: el widget cuenta como nuevo lo que llegó después de esa lectura

    var st = widgetState(), sig = hash(JSON.stringify(st));
    if (sig === prefs.wSig && prefs.wm) return;
    widgetBusy = true;
    try {
      st.t = Date.now();
      var desc = JSON.stringify(st);
      if (!prefs.wm) {
        var list = await ghJson('GET', '/milestones?state=all&per_page=100');
        var found = (Array.isArray(list) ? list : []).filter(function (x) { return x && x.title === WIDGET_TITLE; })[0];
        prefs.wm = found ? found.number : (await ghJson('POST', '/milestones', { title: WIDGET_TITLE, state: 'closed', description: desc })).number;
        if (found) await ghJson('PATCH', '/milestones/' + prefs.wm, { description: desc });
      } else {
        await ghJson('PATCH', '/milestones/' + prefs.wm, { description: desc });
      }
      prefs.wSig = sig; prefs.wAt = Date.now(); widgetErr = '';
    } catch (e) {
      if (e && e.status === 404) prefs.wm = 0;   // el hito ya no existe: se vuelve a crear en el próximo intento

  async function widgetOff() {

    clearTimeout(widgetTimer);
